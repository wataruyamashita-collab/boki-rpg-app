<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#2c3e50">
  <meta name="description" content="仕訳から財務諸表まで、全300問を物語で学べる日商簿記3級学習アプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <title>日商簿記3級 経理シミュレーションRPG</title>
  <link rel="stylesheet" href="css/style.css?v=20260825-21">
</head>
<body>
<div class="container">
  <header class="app-header">
    <div><p class="app-kicker">日商簿記3級を物語で学ぶ</p><h1>経理シミュレーションRPG</h1><p id="player-status" class="player-status" aria-live="polite"></p></div>
  </header>
  <nav class="mode-nav" aria-label="学習モード">
    <button type="button" data-action="mode" data-mode="story">ストーリー</button>
    <button type="button" data-action="mode" data-mode="training">トレーニング</button>
    <button type="button" data-action="mode" data-mode="review">復習</button>
    <button type="button" data-action="mode" data-mode="exam">総合演習模試</button>
  </nav>
  <aside id="exam-hud" class="exam-hud" aria-label="総合演習模試の進行状況"><p id="exam-timer" class="exam-timer" aria-live="polite">残り 60:00</p><p id="exam-progress" aria-live="polite"></p><button type="button" data-action="finish-exam">試験を終了して採点</button></aside>

  <aside id="question-filters" class="question-filters" aria-labelledby="filter-heading">
    <div class="filter-heading"><h2 id="filter-heading">問題を絞り込む</h2><button type="button" class="filter-reset" data-action="filter-reset">条件をクリア</button></div>
    <div class="filter-grid">
      <label>キーワード<input id="filter-query" type="search" placeholder="問題文・カテゴリ・勘定科目" autocomplete="off"></label>
      <label>勘定科目<select id="filter-account"><option value="">すべての勘定科目</option></select></label>
      <label>復習状況<select id="filter-mistakes"><option value="all">すべて</option><option value="incorrect">現在の復習対象</option><option value="attempted">間違えたことがある</option><option value="frequent">間違いが多い順</option></select></label>
    </div>
    <p id="filter-status" class="filter-status" aria-live="polite"></p>
  </aside>

  <main>
    <section id="view-story" class="view"><h2>ストーリーモード</h2><p>取引を処理して、会社の数字を見えるようにしましょう。</p><article id="story-resume" class="resume-card"><p id="resume-scene"></p><strong id="resume-task"></strong><p id="resume-progress"></p><button type="button" data-action="start" id="resume-button">続きから</button></article><details><summary>問題を選んで学ぶ</summary><div id="story-list" class="question-list"></div></details></section>
    <section id="view-training" class="view"><h2>トレーニングモード</h2><p>試算表・元帳・精算表などを形式別に練習します。</p><div id="training-list" class="question-list"></div></section>
    <section id="view-review" class="view"><h2>復習モード</h2><p>間違えた問題を優先して解き直します。</p><div id="review-list" class="question-list"></div></section>
    <section id="view-exam" class="view"><h2>総合演習模試</h2><p>本試験そのものではない独自15問演習です。制限時間60分・100点満点・70点以上を合格圏とし、全問回答後に採点します。</p><div id="exam-list" class="question-list"></div></section>

    <section id="view-question" class="view">
      <form id="question-form" autocomplete="off">
        <p id="q-category" class="question-category"></p><section id="q-story" class="story-box" aria-labelledby="q-scene"><h2 id="q-scene"></h2><p id="q-context"></p><p id="q-task" class="story-task"></p></section><div id="q-text" class="question-text"></div><section id="question-materials" class="question-materials" hidden></section>
        <div id="journal-container" class="journal-entry-area"></div>
        <div id="table-container" class="table-question-wrap"></div>
        <details class="calculator"><summary>計算機を使う</summary><div class="calculator-body">
          <input id="calculator-display" class="calculator-display" value="0" readonly inputmode="numeric" aria-label="計算機の表示">
          <div class="calculator-transfer"><span id="calculator-target" aria-live="polite">金額欄を選んでください</span><button type="button" data-action="calc-insert">表示中の金額を入力</button></div>
          <div class="calculator-keys" aria-label="計算機">
            <button type="button" data-action="calc" data-calc="AC">AC</button><button type="button" data-action="calc" data-calc="C">C</button><button type="button" data-action="calc" data-calc="÷">÷</button><button type="button" data-action="calc" data-calc="×">×</button>
            <button type="button" data-action="calc" data-calc="7">7</button><button type="button" data-action="calc" data-calc="8">8</button><button type="button" data-action="calc" data-calc="9">9</button><button type="button" data-action="calc" data-calc="−">−</button>
            <button type="button" data-action="calc" data-calc="4">4</button><button type="button" data-action="calc" data-calc="5">5</button><button type="button" data-action="calc" data-calc="6">6</button><button type="button" data-action="calc" data-calc="＋">＋</button>
            <button type="button" data-action="calc" data-calc="1">1</button><button type="button" data-action="calc" data-calc="2">2</button><button type="button" data-action="calc" data-calc="3">3</button><button type="button" data-action="calc" data-calc="＝">＝</button>
            <button type="button" data-action="calc" data-calc="0">0</button><button type="button" data-action="calc" data-calc="00">00</button><button type="button" data-action="calc" data-calc=".">.</button>
          </div></div></details>
        <p id="save-status" class="save-status" aria-live="polite"></p>
        <fieldset class="confidence-selector"><legend>回答前の確信度（成績には影響しません）</legend><label><input type="radio" name="confidence" value="unsure" checked>まだ自信なし <small>正解なら「不安定な知識」として確認</small></label><label><input type="radio" name="confidence" value="sure">自信あり <small>誤答なら「強い思い込み」として重点復習</small></label></fieldset>
        <div class="question-actions"><button class="confirm-button" type="submit">回答を確定する</button><button class="secondary-button save-button" type="button" data-action="save">ここまで保存する</button></div>
      </form>
    </section>
    <section id="view-result" class="view"><div id="result-status" class="result-box" role="status" aria-live="polite"></div><div id="answer-comparison" class="answer-comparison"></div><div id="correct-journal" class="correct-journal"></div><div id="explanation" class="explanation-box"></div><div id="standard-result-actions"><button type="button" data-action="next">次へ進む</button></div><div id="exam-result-actions" class="result-actions" hidden><button type="button" data-action="exam-home">ホームへ戻る</button><button type="button" class="secondary-button" data-action="exam-review">結果を復習する</button><button type="button" class="secondary-button" data-action="exam-retry">もう一度総合演習</button></div></section>
  </main>
</div>
<script src="data/questions.js?v=20260825-21"></script><script src="js/calculator.js?v=20260825-21"></script><script src="js/model.js?v=20260825-21"></script><script src="js/rpg.js?v=20260825-21"></script><script src="js/engine.js?v=20260825-21"></script><script src="js/feedback.js?v=20260825-21"></script><script src="js/view.js?v=20260825-21"></script><script src="js/controller.js?v=20260825-21"></script><script src="js/app.js?v=20260825-21"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>経理シミュレーションRPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  
  <!-- ストーリービュー -->
  <div id="view-story" class="view active">
    <h2 id="story-title">第1章　会社の姿が見えない社長</h2>
    <div id="story-content" class="story-box">
      <p><strong>社長：</strong>「君が新しい経理担当者だね。売上は伸びているはずなのだが、会社に今いくら現金があるのか、よく分からなくてね……」</p>
      <p><strong>主人公：</strong>「初めまして。一つひとつ数字を整理して、会社の状況を見えるようにしていきましょう！」</p>
    </div>
    <button id="story-start-button" onclick="App.startQuestion('J001')">最初の取引を処理する</button>
  </div>

  <!-- 問題回答ビュー -->
  <div id="view-question" class="view">
    <div id="progress" class="progress" aria-live="polite"></div>
    <div id="q-category" style="color:#7f8c8d; font-size: 0.9rem;"></div>
    <div id="q-text" class="question-text"></div>

    <!-- 仕訳入力エリア -->
    <div class="journal-entry-area" id="journal-container"></div>

    <!-- 問題文の金額計算用。一般的な実務電卓と同じ数字・演算キー配列にする。 -->
    <details class="calculator">
      <summary>計算機を使う</summary>
      <div class="calculator-body">
        <input id="calculator-display" class="calculator-display" type="text" value="0" readonly aria-label="計算機の表示">
        <div id="calculator-keys" class="calculator-keys" aria-label="計算機">
          <button type="button" data-calc="AC" class="calculator-clear">AC</button>
          <button type="button" data-calc="C" class="calculator-clear">C</button>
          <button type="button" data-calc="÷" class="calculator-operator">÷</button>
          <button type="button" data-calc="×" class="calculator-operator">×</button>
          <button type="button" data-calc="7">7</button>
          <button type="button" data-calc="8">8</button>
          <button type="button" data-calc="9">9</button>
          <button type="button" data-calc="−" class="calculator-operator">−</button>
          <button type="button" data-calc="4">4</button>
          <button type="button" data-calc="5">5</button>
          <button type="button" data-calc="6">6</button>
          <button type="button" data-calc="＋" class="calculator-operator">＋</button>
          <button type="button" data-calc="1">1</button>
          <button type="button" data-calc="2">2</button>
          <button type="button" data-calc="3">3</button>
          <button type="button" data-calc="＝" class="calculator-equals">＝</button>
          <button type="button" data-calc="0" class="calculator-zero">0</button>
          <button type="button" data-calc=".">.</button>
        </div>
      </div>
    </details>
    
    <div id="save-status" class="save-status" aria-live="polite"></div>
    <button class="secondary-button" onclick="App.saveDraft(true)">ここまで保存する</button>
    <button onclick="App.submitAnswer()">仕訳を確定する</button>
  </div>

  <!-- 結果・解説ビュー -->
  <div id="view-result" class="view">
    <div id="result-status" class="result-box"></div>
    <div id="correct-journal" class="correct-journal"></div>
    <div id="explanation" class="explanation-box"></div>
    <button onclick="App.nextStep()">次へ進む</button>
  </div>

</div>

<!-- 外部ファイルの読み込み -->
<script src="data/questions.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>

</body>
</html>

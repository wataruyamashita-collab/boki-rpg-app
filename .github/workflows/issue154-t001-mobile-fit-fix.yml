name: Issue 154 T001 mobile fit fix
on:
  push:
    branches:
      - codex/issue-154-explanation-ux-integration

permissions:
  contents: write

jobs:
  fix-trial-balance-mobile-fit:
    if: github.event.head_commit.message == 'Prepare T001 mobile fit fix'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/issue-154-explanation-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check helper syntax
        run: node --check .github/issue154-t001-mobile-fit-fix.js

      - run: npm ci

      - name: Verify exact Generation 49 baseline
        run: |
          npm run verify
          npm run qa:integrity
          git diff --check

      - name: Apply T001 mobile-fit fix and create Generation 50 candidate
        run: node .github/issue154-t001-mobile-fit-fix.js

      - name: Mandatory pre-commit verification
        run: |
          npm run verify
          npm run qa:integrity
          node .github/visual/gate-core.test.js
          node .github/visual/harness-source.test.js
          git diff --check

      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify T001 mobile fit and existing browser gates
        run: |
          node .github/visual/run-visual.js strict
          node .github/visual/run-explanation-integration.js

      - name: Commit verified Generation 50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css tests/mobile-layout.test.js .github/visual/run-explanation-integration.js independent-audit/tests/generation-immutability.test.js index.html service-worker.js pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-50.json
          git diff --cached --check
          git commit -m "Finalize Generation 50 for trial balance mobile fit"

      - name: Verify committed Generation 50
        run: |
          rm -rf artifacts node_modules
          npm ci
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check

      - name: Remove temporary helper after mandatory verification
        run: |
          git rm .github/workflows/issue154-t001-mobile-fit-fix.yml .github/issue154-t001-mobile-fit-fix.js
          git commit -m "Remove T001 mobile fit helper"

      - name: Final exact-tree verification and publish
        run: |
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          rm -rf artifacts node_modules
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-154-explanation-ux-integration

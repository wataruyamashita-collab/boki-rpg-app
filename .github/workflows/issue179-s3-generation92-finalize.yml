# Generation 92 Issue #179 S3A Narrative Result pilot finalizer
# Candidate authority is validated before commit.
# Full npm/qa/browser validation runs on the exact final PR HEAD after publish.
name: Issue 179 S3A Generation 92 finalizer
on:
  push:
    branches:
      - codex/issue-179-s3-narrative-result-pilot
    paths:
      - '.github/workflows/issue179-s3-generation92-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 92 Issue 179 S3A'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-179-s3-narrative-result-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-authority S3A checks
        run: |
          node tests/story-narrative-result.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/audit-data.js
          node scripts/audit-editorial.js
          git diff --check
      - name: Prepare Release 20260924-161 and Generation 92 candidate
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const OLD='20260924-160', NEXT='20260924-161';
          const root=process.cwd();
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,value)=>fs.writeFileSync(path.join(root,file),value);
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const replaceOne=(source,from,to,label)=>{
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(from,to);
          };

          let sw=read('service-worker.js');
          sw=replaceOne(sw,`const RELEASE = '${OLD}';`,`const RELEASE = '${NEXT}';`,'service worker release');
          write('service-worker.js',sw);

          let index=read('index.html');
          const token=`?v=${OLD}`;
          const tokenCount=index.split(token).length-1;
          if(tokenCount!==15)throw new Error(`index release token count: ${tokenCount}`);
          index=index.split(token).join(`?v=${NEXT}`);
          write('index.html',index);

          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(read(manifestPath));
          if(manifest.release!==OLD)throw new Error(`unexpected current release: ${manifest.release}`);
          manifest.previousRelease=OLD;
          manifest.release=NEXT;
          for(const file of Object.keys(manifest.assets||{})){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`release asset missing: ${file}`);
            manifest.assets[file]=sha(file);
          }
          write(manifestPath,JSON.stringify(manifest,null,2)+'\n');

          const immPath='independent-audit/tests/generation-immutability.test.js';
          let imm=read(immPath);
          const list91=Array.from({length:89},(_,i)=>i+2).join(',');
          const list92=Array.from({length:90},(_,i)=>i+2).join(',');
          imm=replaceOne(imm,`  [${list91}]\n    .filter`,`  [${list92}]\n    .filter`,'authority byte list');
          imm=replaceOne(
            imm,
            `  const generation91Committed=committed(90);\n`,
            `  const generation91Committed=committed(90);\n  const generation92Committed=committed(91);\n`,
            'generation 91 committed declaration'
          );
          imm=replaceOne(
            imm,
            "'authority sequence tracks committed Generations through 90'",
            "'authority sequence tracks committed Generations through 91'",
            'sequence title'
          );
          imm=replaceOne(
            imm,
            `      generation91Committed\n        ? [${list91}]\n        : generation89Committed`,
            `      generation92Committed\n        ? [${list92}]\n        : generation91Committed\n        ? [${list91}]\n        : generation89Committed`,
            'sequence head'
          );
          imm=replaceOne(
            imm,
            `  for(const generation of [${list91}]){`,
            `  for(const generation of [${list92}]){`,
            'duplicate generation list'
          );
          imm=replaceOne(
            imm,
            `  const generation91Pending=\n    fs.existsSync(authorityPath(90))&&!generation91Committed;`,
            `  const generation92Pending=\n    fs.existsSync(authorityPath(91))&&!generation92Committed;\n  const generation91Pending=\n    fs.existsSync(authorityPath(90))&&!generation91Committed;`,
            'generation 91 pending declaration'
          );
          const generation92Block=`  if(generation92Committed){\n    test(\n      'committed Generation 92 current integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCurrent().ok,\n        true\n      )\n    );\n  }else if(generation92Pending){\n    const generation92Candidate=\n      JSON.parse(fs.readFileSync(authorityPath(91),'utf8'));\n    test(\n      'pending Generation 92 candidate integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCandidate(generation92Candidate).ok,\n        true\n      )\n    );\n  }else if(generation91Committed){`;
          imm=replaceOne(imm,'  if(generation91Committed){',generation92Block,'generation 91 integrity branch');
          write(immPath,imm);

          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const output=path.join(root,'reports/auto-gate/audit-locks/phase-b-generation-92.json');
          if(fs.existsSync(output))throw new Error('Generation 92 already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==90)throw new Error('Generation 91 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==91||candidate.predecessor?.generation!==90)throw new Error('Generation 92 chain mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok)throw new Error(`candidate invalid: ${verification.errors.join(', ')}`);
          fs.writeFileSync(output,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log(`GENERATION_91_CANDIDATE_READY ${candidate.auditHash} ${candidate.baselineIdentity}`);
          NODE
      - name: Pending Generation 92 validation
        run: |
          node tests/story-narrative-result.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/qa/verify-audit-candidate.js reports/auto-gate/audit-locks/phase-b-generation-92.json
          git diff --check
      - name: Commit verified Generation 92
        run: |
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected=$(printf "%s\n" \
            "independent-audit/tests/generation-immutability.test.js" \
            "index.html" \
            "pwa-release-manifest.json" \
            "reports/auto-gate/audit-locks/phase-b-generation-92.json" \
            "service-worker.js" | sort)
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "GENERATION_91_FINALIZATION_REFUSED: dirty scope mismatch"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git add independent-audit/tests/generation-immutability.test.js index.html pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-92.json service-worker.js
          git diff --cached --check
          git commit -m "Finalize Generation 92 Issue 179 S3A"
      - name: Verify committed Generation 92 authority
        run: |
          node tests/story-narrative-result.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue179-s3-generation92-finalize.yml
          git commit -m "Remove Generation 92 Issue 179 S3A finalizer"
      - name: Final exact-tree verification and publish
        run: |
          node tests/story-narrative-result.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-179-s3-narrative-result-pilot

name: Issue 179 S1 audit matrix refresh
on:
  push:
    branches:
      - codex/issue-179-s1-narrative-semantic-alignment
    paths:
      - '.github/workflows/issue179-s1-audit-matrix-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh Issue 179 S1 audit matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-179-s1-narrative-semantic-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh narrative-only audit matrix identity stamps
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const {evidenceStamp,loadQuestions,verifyMatrix}=require('./scripts/audit-matrix');
          const stable=value=>{
            if(Array.isArray(value))return value.map(stable);
            if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,stable(value[key])]));
            return value;
          };
          const auditedSourceStable=q=>stable({
            id:q.id,
            type:q.type,
            category:q.category,
            question:q.question,
            materials:q.materials,
            adjustments:q.adjustments,
            table:q.table
          });
          const loadFromSource=source=>{
            const sandbox={window:{}};
            vm.createContext(sandbox);
            vm.runInContext(source,sandbox,{filename:'data/questions.js'});
            return sandbox.window.QuestionData;
          };

          const current=loadQuestions();
          const mainSource=cp.execFileSync('git',['show','origin/main:data/questions.js'],{encoding:'utf8'});
          const baseline=loadFromSource(mainSource);
          const currentIds=Object.keys(current).sort();
          const baselineIds=Object.keys(baseline).sort();
          if(currentIds.length!==300||JSON.stringify(currentIds)!==JSON.stringify(baselineIds)){
            throw new Error('audit matrix refresh refused: canonical ID set changed');
          }

          const matrixPath='reports/question-audit-matrix.json';
          const matrix=JSON.parse(fs.readFileSync(matrixPath,'utf8'));
          if(!Array.isArray(matrix.rows)||matrix.rows.length!==300){
            throw new Error('audit matrix refresh refused: matrix row count');
          }
          const rows=new Map(matrix.rows.map(row=>[row.id,row]));
          if(rows.size!==300)throw new Error('audit matrix refresh refused: duplicate/missing matrix IDs');

          let refreshed=0,narrativeRefreshed=0;
          for(const id of currentIds){
            const before=baseline[id],after=current[id],row=rows.get(id);
            if(!row)throw new Error(`audit matrix refresh refused: missing row ${id}`);
            if(JSON.stringify(auditedSourceStable(before))!==JSON.stringify(auditedSourceStable(after))){
              throw new Error(`audit matrix refresh refused: question/material/table source changed for ${id}`);
            }

            const beforeStamp=evidenceStamp(before);
            const afterStamp=evidenceStamp(after);
            if(beforeStamp.answerSchemaHash!==afterStamp.answerSchemaHash){
              throw new Error(`audit matrix refresh refused: answer schema changed for ${id}`);
            }
            if(row.type!==after.type||row.category!==after.category||row.chapter!==after.chapter){
              throw new Error(`audit matrix refresh refused: identity changed for ${id}`);
            }

            const narrativeChanged=before.scene!==after.scene||before.story!==after.story;
            if(narrativeChanged){
              if(!row.story||row.story.status!=='VERIFIED'){
                throw new Error(`audit matrix refresh refused: prior story evidence status is not VERIFIED for ${id}`);
              }
              row.story.finding=`semantic chapterに整合したNarrative Bibleへ更新後のruntime Storyを再検証し、「${after.category}」の業務文脈とchapter整合を確認した。`;
              narrativeRefreshed++;
            }

            if(row.sourceHash!==afterStamp.sourceHash||row.answerSchemaHash!==afterStamp.answerSchemaHash)refreshed++;
            row.sourceHash=afterStamp.sourceHash;
            row.answerSchemaHash=afterStamp.answerSchemaHash;
          }

          const verification=verifyMatrix(matrix,current);
          if(!verification.ok){
            throw new Error(`audit matrix refresh failed: ${JSON.stringify(verification.stale.slice(0,10))}`);
          }
          fs.writeFileSync(matrixPath,JSON.stringify(matrix,null,2)+'\n');
          console.log(`AUDIT_MATRIX_NARRATIVE_REFRESH_PASS refreshed=${refreshed} narrativeRefreshed=${narrativeRefreshed}`);
          NODE
      - name: Validate refreshed evidence
        run: |
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node tests/audit-matrix.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          npm run qa:integrity
          git diff --check
      - name: Commit refreshed audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected="reports/question-audit-matrix.json"
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          test "$actual" = "$expected"
          git add reports/question-audit-matrix.json
          git diff --cached --check
          git commit -m "Refresh Issue 179 S1 audit evidence"
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue179-s1-audit-matrix-refresh.yml
          git commit -m "Remove Issue 179 S1 audit refresh workflow"
      - name: Publish
        run: |
          node tests/audit-matrix.test.js
          node tests/story-narrative-bible.test.js
          npm run qa:integrity
          git diff --check
          rm -rf node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-179-s1-narrative-semantic-alignment

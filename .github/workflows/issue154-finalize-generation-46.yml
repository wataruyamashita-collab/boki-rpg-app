name: Issue 154 finalize Generation 46
on:
  push:
    branches:
      - codex/issue-154-explanation-ux-integration

permissions:
  contents: write

jobs:
  finalize-generation-46:
    if: github.event.head_commit.message == 'Prepare remote Generation 46 finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/issue-154-explanation-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify current Generation 45 baseline
        run: npm run verify
      - name: Apply source-table guidance
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s);
          const replaceOnce=(file,from,to,label)=>{
            const source=read(file);
            if(source.split(from).length!==2)throw new Error('unexpected anchor count: '+label);
            write(file,source.replace(from,to));
          };
          replaceOnce(
            'js/explanation-model.js',
            "  function sourceValues(m){if(!obj(m))return[{label:'内容',value:String(m??'')}];return Object.entries(m).filter(([k,v])=>!['資料','title','name','type','document'].includes(k)&&shown(v)).map(([k,v])=>({label:String(k),value:num(v)}));}\n  function sources(q){const ms=arr(q.materials).filter(v=>v!=null);if(ms.length)return ms.map((m,i)=>({kind:'material',title:String(m?.['資料']||m?.title||m?.name||m?.type||m?.document||\`資料\${i+1}\`),focus:'資料の項目と数値を確認',values:sourceValues(m),evidenceRef:\`materials[\${i}]\`}));if(q.table?.rows?.length)return[{kind:'table',title:q.category||'問題の表',focus:'行・列・入力欄の位置と、すでに記載されている数値を確認',values:q.table.rows.map((r,i)=>({label:rowName(q,r,i),value:Object.entries(r).filter(([,v])=>shown(v)).map(([k,v])=>\`\${labels[k]||k}:\${num(v)}\`).join(' / ')})),evidenceRef:'table.rows'}];return[{kind:'prompt',title:'問題文',focus:'取引条件・日付・金額・指定された処理を確認',values:[{label:'問題',value:String(q.question||'')}],evidenceRef:'question'}];}",
            "  function sourceValues(m){if(!obj(m))return[{label:'内容',value:String(m??'')}];return Object.entries(m).filter(([k,v])=>!['資料','title','name','type','document'].includes(k)&&shown(v)).map(([k,v])=>({label:String(k),value:num(v)}));}\n  const tableColumnLabel=k=>k==='unitPrice'?'単価（円）':k==='amount'?'金額（円）':labels[k]||String(k);\n  function sourceTable(q){const columns=arr(q.table?.columns),rows=arr(q.table?.rows);if(!columns.length||!rows.length||!columns.every(key=>rows.some(row=>obj(row)&&Object.prototype.hasOwnProperty.call(row,key))))return null;return{columns:columns.map(key=>({key:String(key),label:tableColumnLabel(key)})),rows:rows.map(row=>columns.map(key=>({key:String(key),value:obj(row)?row[key]:null})))};}\n  const tableFocus=q=>(q.format==='bookkeeping-inventory-ledger'||/商品有高帳/u.test(String(q.category||'')))?'日付ごとに「数量 → 単価 → 金額」の順で横に確認します。':'行・列・入力欄の位置と、すでに記載されている数値を確認';\n  function sources(q){const ms=arr(q.materials).filter(v=>v!=null);if(ms.length)return ms.map((m,i)=>({kind:'material',title:String(m?.['資料']||m?.title||m?.name||m?.type||m?.document||\`資料\${i+1}\`),focus:'資料の項目と数値を確認',values:sourceValues(m),evidenceRef:\`materials[\${i}]\`}));if(q.table?.rows?.length)return[{kind:'table',title:q.category||'問題の表',focus:tableFocus(q),values:q.table.rows.map((r,i)=>({label:rowName(q,r,i),value:Object.entries(r).filter(([,v])=>shown(v)).map(([k,v])=>\`\${labels[k]||k}:\${num(v)}\`).join(' / ')})),table:sourceTable(q),evidenceRef:'table.rows'}];return[{kind:'prompt',title:'問題文',focus:'取引条件・日付・金額・指定された処理を確認',values:[{label:'問題',value:String(q.question||'')}],evidenceRef:'question'}];}",
            'structured source table model'
          );
          replaceOnce(
            'js/view.js',
            "        if (key === 'sources') items.forEach(item => { const card = element('article', 'explanation-source-card'); card.append(element('h6', '', item.title), element('p', 'explanation-source-focus', item.focus)); const list = element('dl', 'explanation-source-values'); (item.values || []).forEach(value => { const row = element('div', 'explanation-source-value'); row.append(element('dt', '', value.label), element('dd', '', valueText(value.value))); list.append(row); }); card.append(list); section.append(card); });",
            "        if (key === 'sources') items.forEach(item => {\n          const card = element('article', 'explanation-source-card');\n          card.append(element('h6', '', item.title), element('p', 'explanation-source-focus', item.focus));\n          if (item.table?.columns?.length && item.table?.rows?.length) {\n            const wrap = element('div', 'explanation-source-table-wrap'); wrap.tabIndex = 0; wrap.setAttribute('aria-label', \`\${item.title}の確認表\`);\n            const table = element('table', 'explanation-source-table'), thead = element('thead', ''), headRow = element('tr', '');\n            item.table.columns.forEach(column => { const th = element('th', '', column.label); th.scope = 'col'; headRow.append(th); });\n            thead.append(headRow); table.append(thead);\n            const tbody = element('tbody', '');\n            item.table.rows.forEach(row => { const tr = element('tr', ''); row.forEach(cell => { const unknown = cell.value === '入力'; const className = unknown ? 'explanation-source-unknown' : (typeof cell.value === 'number' ? 'is-number' : ''); const shownValue = unknown ? '？' : (cell.value == null || cell.value === '' ? '—' : (typeof cell.value === 'number' ? cell.value.toLocaleString('ja-JP') : String(cell.value))); tr.append(element('td', className, shownValue)); }); tbody.append(tr); });\n            table.append(tbody); wrap.append(table); card.append(wrap);\n          } else {\n            const list = element('dl', 'explanation-source-values');\n            (item.values || []).forEach(value => { const row = element('div', 'explanation-source-value'); row.append(element('dt', '', value.label), element('dd', '', valueText(value.value))); list.append(row); });\n            card.append(list);\n          }\n          section.append(card);\n        });",
            'source table renderer'
          );
          replaceOnce(
            'css/style.css',
            ".explanation-source-value dd { min-width:0; margin:0; overflow-wrap:anywhere; }",
            ".explanation-source-value dd { min-width:0; margin:0; overflow-wrap:anywhere; }\n.explanation-source-table-wrap { max-width:100%; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; border:1px solid #d5dce0; border-radius:8px; background:#fff; }\n.explanation-source-table { width:100%; min-width:520px; border-collapse:collapse; font-size:.88rem; font-variant-numeric:tabular-nums; }\n.explanation-source-table th,.explanation-source-table td { padding:8px 10px; border-right:1px solid #e1e7eb; border-bottom:1px solid #e1e7eb; white-space:nowrap; }\n.explanation-source-table th:last-child,.explanation-source-table td:last-child { border-right:0; }\n.explanation-source-table tbody tr:last-child td { border-bottom:0; }\n.explanation-source-table th { background:#eef3f6; text-align:left; font-weight:800; }\n.explanation-source-table td.is-number { text-align:right; }\n.explanation-source-table td.explanation-source-unknown { text-align:center; font-weight:900; }",
            'source table styles'
          );
          replaceOnce(
            'tests/chapter8-explanation.test.js',
            "const voucherModel=ExplanationModel.build(sandbox.window.QuestionData.L050,{cells:{}},{correct:false});",
            "const inventoryModel=ExplanationModel.build(sandbox.window.QuestionData.L029,{cells:{}},{correct:false});\nconst inventorySource=inventoryModel.sources[0];\nassert.strictEqual(inventorySource.kind,'table','L029は表形式の資料として扱う');\nassert.strictEqual(inventorySource.focus,'日付ごとに「数量 → 単価 → 金額」の順で横に確認します。','L029は初学者が見る順番を明示する');\nassert.deepStrictEqual(JSON.parse(JSON.stringify(inventorySource.table.columns.map(column=>column.label))),['日付','摘要','数量','単価（円）','金額（円）'],'L029の確認表は元の商品有高帳5列を保持する');\nassert.strictEqual(inventorySource.table.rows.length,4,'L029の確認表は4行を保持する');\nassert.strictEqual(inventorySource.table.rows.flat().filter(cell=>cell.value==='入力').length,3,'L029の未回答3欄は正答値へ展開しない');\nconst voucherModel=ExplanationModel.build(sandbox.window.QuestionData.L050,{cells:{}},{correct:false});",
            'L029 source table regression'
          );
          replaceOnce(
            'tests/explanation-integration.test.js',
            "assert(/\\.explanation-formula strong\\s*\\{[^}]*overflow-wrap:\\s*anywhere/s.test(css),'計算ブロックをiPhoneでクリップしない');",
            "assert(/\\.explanation-formula strong\\s*\\{[^}]*overflow-wrap:\\s*anywhere/s.test(css),'計算ブロックをiPhoneでクリップしない');\nassert(view.includes('explanation-source-table-wrap'),'表資料は専用の横スクロール領域で表示する');\nassert(/\\.explanation-source-table-wrap\\s*\\{[^}]*overflow-x:\\s*auto/s.test(css),'確認表は狭い画面で表だけ横スクロールできる');\nassert(/\\.explanation-source-table\\s*\\{[^}]*min-width:\\s*520px/s.test(css),'確認表の列幅を潰さない');",
            'source table integration assertions'
          );
          replaceOnce(
            'tests/explanation-integration.test.js',
            "const feedbackIndex=html.indexOf('js/feedback.js?v=20260924-114'),modelIndex=html.indexOf('js/explanation-model.js?v=20260924-114'),viewIndex=html.indexOf('js/view.js?v=20260924-114');",
            "const feedbackIndex=html.indexOf('js/feedback.js?v=20260924-115'),modelIndex=html.indexOf('js/explanation-model.js?v=20260924-115'),viewIndex=html.indexOf('js/view.js?v=20260924-115');",
            'integration release'
          );
          replaceOnce(
            '.github/visual/run-explanation-integration.js',
            "sourceCards:qs('.explanation-source-card').length,transferCards:qs('.explanation-transfer-card').length",
            "sourceCards:qs('.explanation-source-card').length,sourceTables:qs('.explanation-source-table').length,sourceTableHeaders:qs('.explanation-source-table th').map(e=>e.textContent),sourceTableRows:qs('.explanation-source-table tbody tr').length,sourceUnknowns:qs('.explanation-source-unknown').length,transferCards:qs('.explanation-transfer-card').length",
            'visual source table measurements'
          );
          replaceOnce(
            '.github/visual/run-explanation-integration.js',
            "if(m.sourceCards<1||m.transferCards<1||m.checks<1||m.mistakes<1)violations.push('REQUIRED_VISUAL_COMPONENT_MISSING');",
            "if(m.sourceCards<1||m.transferCards<1||m.checks<1||m.mistakes<1)violations.push('REQUIRED_VISUAL_COMPONENT_MISSING');if(caseId==='L029'&&(m.sourceTables!==1||JSON.stringify(m.sourceTableHeaders)!==JSON.stringify(['日付','摘要','数量','単価（円）','金額（円）'])||m.sourceTableRows!==4||m.sourceUnknowns!==3))violations.push('SOURCE_TABLE_STRUCTURE');",
            'visual L029 source table gate'
          );
          const index=read('index.html');
          if((index.match(/20260924-114/g)||[]).length!==13)throw new Error('unexpected index release token count');
          write('index.html',index.replaceAll('20260924-114','20260924-115'));
          replaceOnce('service-worker.js',"const RELEASE = '20260924-114';","const RELEASE = '20260924-115';",'service worker release');
          const manifest=JSON.parse(read('pwa-release-manifest.json'));
          if(manifest.release!=='20260924-114'||manifest.previousRelease!=='20260924-113')throw new Error('unexpected release manifest baseline');
          const digest=buffer=>crypto.createHash('sha256').update(buffer).digest('hex');
          for(const file of ['css/style.css','js/explanation-model.js','js/view.js'])manifest.assets[file]=digest(fs.readFileSync(file));
          manifest.previousRelease='20260924-114';
          manifest.release='20260924-115';
          write('pwa-release-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Pre-authority targeted regression
        run: |
          node tests/chapter8-explanation.test.js
          node tests/explanation-integration.test.js
          node tests/service-worker.test.js
          node scripts/audit-matrix.js
          git diff --check
      - name: Generate Generation 46 finalization support
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),childProcess=require('child_process');
          const core=require('./scripts/qa/audit-core'),lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s);
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=args=>childProcess.execFileSync('git',args,{encoding:'utf8'}).trim();
          const must=(s,a,b,label)=>{if(!s.includes(a))throw new Error('missing '+label);return s.replace(a,b);};
          const seq=max=>'['+Array.from({length:max-1},(_,i)=>i+2).join(',')+']';
          const approvedHead=git(['rev-parse','HEAD']),approvedTree=git(['rev-parse','HEAD^{tree}']);
          const authorityRel=[lifecycle.ROOT_LOCK,...Array.from({length:44},(_,i)=>`reports/auto-gate/audit-locks/phase-b-generation-${i+2}.json`)];
          const expectedAuthoritySha256=authorityRel.map(f=>digest(fs.readFileSync(f)));
          const productionFiles=['css/style.css','data/questions.js','index.html','js/explanation-model.js','js/view.js','pwa-release-manifest.json','service-worker.js'];
          const finalProductionSha256=Object.fromEntries(productionFiles.map(f=>[f,core.sha(f)]));
          const finalizer=`'use strict';
          const childProcess=require('child_process'),crypto=require('crypto'),fs=require('fs'),path=require('path'),core=require('./audit-core'),lifecycle=require('./phase-b-lifecycle');
          const output=path.join(core.ROOT,'reports/auto-gate/audit-locks/phase-b-generation-46.json');
          const authorityPaths=[lifecycle.ROOT_LOCK,...Array.from({length:44},(_,i)=>\`reports/auto-gate/audit-locks/phase-b-generation-\${i+2}.json\`)].map(f=>path.join(core.ROOT,f));
          const expectedAuthoritySha256=${JSON.stringify(expectedAuthoritySha256)};
          const approvedHead='${approvedHead}',approvedTree='${approvedTree}';
          const finalProductionSha256=${JSON.stringify(finalProductionSha256)};
          const requiredDirty=new Set(['.github/visual/run-explanation-integration.js','css/style.css','index.html','independent-audit/tests/generation-46-finalizer.test.js','independent-audit/tests/generation-immutability.test.js','js/explanation-model.js','js/view.js','package.json','pwa-release-manifest.json','scripts/qa/finalize-phase-b-generation-46.js','scripts/qa/validate-auto-gate.js','service-worker.js','tests/chapter8-explanation.test.js','tests/explanation-integration.test.js']);
          const NEW_RELEASE='20260924-115',PREVIOUS_RELEASE='20260924-114';
          const fail=m=>{console.error(\`PHASE_B_GENERATION_46_FINALIZATION_REFUSED: \${m}\`);process.exitCode=1;return false;};
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=a=>childProcess.execFileSync('git',a,{cwd:core.ROOT,encoding:'utf8'}).trim();
          const changedFiles=()=>git(['status','--porcelain','--untracked-files=all']).split(/\\n/u).filter(Boolean).map(l=>l.slice(2).trim());
          function validateRelease(){const m=JSON.parse(fs.readFileSync(path.join(core.ROOT,'pwa-release-manifest.json'),'utf8')),w=fs.readFileSync(path.join(core.ROOT,'service-worker.js'),'utf8'),i=fs.readFileSync(path.join(core.ROOT,'index.html'),'utf8');if(m.release!==NEW_RELEASE||m.previousRelease!==PREVIOUS_RELEASE)throw Error('release manifest version mismatch');if(!w.includes(\`const RELEASE = '\${NEW_RELEASE}';\`))throw Error('service worker release mismatch');if(i.includes(\`?v=\${PREVIOUS_RELEASE}\`)||(i.match(new RegExp(\`\\\\?v=\${NEW_RELEASE}\`,'g'))||[]).length!==13)throw Error('index release tokens mismatch');for(const[f,s]of Object.entries(m.assets))if(core.sha(f)!==s)throw Error(\`release asset hash mismatch: \${f}\`);}
          function finalize(){if(fs.existsSync(output)||lifecycle.generationAuthorities().some(x=>x.document.generation===46))return fail('Generation 46 already exists');if(authorityPaths.some((f,i)=>!fs.existsSync(f)||digest(fs.readFileSync(f))!==expectedAuthoritySha256[i]))return fail('historical authority raw bytes changed');if(git(['rev-parse','HEAD'])!==approvedHead||git(['rev-parse','HEAD^{tree}'])!==approvedTree)return fail('approved Generation 45 successor baseline mismatch');const d=changedFiles();if(d.length!==requiredDirty.size||d.some(f=>!requiredDirty.has(f))||[...requiredDirty].some(f=>!d.includes(f)))return fail(\`dirty scope mismatch: \${d.join(', ')}\`);try{validateRelease();}catch(e){return fail(e.message);}for(const[f,s]of Object.entries(finalProductionSha256))if(core.sha(f)!==s)return fail(\`final Production hash mismatch: \${f}\`);const a=lifecycle.generationAuthorities();if(JSON.stringify(a.map(x=>x.document.generation))!==JSON.stringify(Array.from({length:44},(_,i)=>i+2)))return fail('authority sequence must be exactly [2..45]');let c;try{c=lifecycle.createCandidate();}catch(e){return fail(e.message);}if(c.generation!==46||JSON.stringify(c.predecessor)!==JSON.stringify(lifecycle.identity(a.at(-1).document)))return fail('candidate predecessor or generation mismatch');const v=lifecycle.verifyCandidate(c);if(!v.ok)return fail(v.errors.join(', '));fs.writeFileSync(output,JSON.stringify(c,null,2)+'\\n',{flag:'wx'});console.log(\`FINALIZED \${path.relative(core.ROOT,output)}\`);return true;}
          if(require.main===module){if(!finalize())process.exit(1);}module.exports={finalProductionSha256,NEW_RELEASE,PREVIOUS_RELEASE,approvedHead,approvedTree,authorityPaths,expectedAuthoritySha256,finalize,output,validateRelease};
          `;
          write('scripts/qa/finalize-phase-b-generation-46.js',finalizer);

          const finalizerTest=`'use strict';
          const assert=require('assert'),childProcess=require('child_process'),crypto=require('crypto'),fs=require('fs');
          const core=require('../../scripts/qa/audit-core'),lifecycle=require('../../scripts/qa/phase-b-lifecycle'),finalizer=require('../../scripts/qa/finalize-phase-b-generation-46');
          let count=0;const test=(name,fn)=>{fn();count++;console.log(\`ok \${count} - \${name}\`);};const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const authorities=lifecycle.generationAuthorities(),g45=authorities.find(x=>x.document.generation===45),g46=authorities.find(x=>x.document.generation===46);
          test('Generation 46 is discoverable',()=>assert(g46));
          test('Generation 46 predecessor is exact Generation 45',()=>assert.deepStrictEqual(g46.document.predecessor,lifecycle.identity(g45.document)));
          test('Generation 46 production identity changes for source-table guidance',()=>assert.notStrictEqual(g46.document.baselineIdentity,g45.document.baselineIdentity));
          test('committed Generation 46 current integrity passes',()=>assert.strictEqual(lifecycle.verifyCurrent().ok,true));
          test('duplicate Generation 46 issuance fails',()=>assert.notStrictEqual(childProcess.spawnSync(process.execPath,['scripts/qa/finalize-phase-b-generation-46.js'],{cwd:core.ROOT,encoding:'utf8'}).status,0));
          test('historical authority raw SHA values are pinned',()=>assert.deepStrictEqual(finalizer.authorityPaths.map(f=>digest(fs.readFileSync(f))),finalizer.expectedAuthoritySha256));
          console.log(\`Generation 46 finalizer regressions: \${count}/\${count}\`);
          `;
          write('independent-audit/tests/generation-46-finalizer.test.js',finalizerTest);

          let imm=read('independent-audit/tests/generation-immutability.test.js');
          const seq44=seq(44),seq45=seq(45),seq46=seq(46);
          imm=imm.replaceAll(seq45,seq46);
          imm=imm.replaceAll(seq44,seq45);
          imm=imm.replaceAll('generation45Committed','generation46Committed');
          imm=must(imm,'committed(45)','committed(46)','committed generation');
          imm=must(imm,'stale-predecessor Generation 46 successor is rejected','stale-predecessor Generation 47 successor is rejected','stale successor label');
          imm=must(imm,'skipped.generation=46','skipped.generation=47','stale successor generation');
          imm=imm.replaceAll('Generation 45','Generation 46');
          imm=imm.replaceAll('authorityPath(45)','authorityPath(46)');
          imm=imm.replaceAll('document.generation<45','document.generation<46');
          write('independent-audit/tests/generation-immutability.test.js',imm);

          const pkg=JSON.parse(read('package.json'));
          if(!pkg.scripts['qa:test'].includes('generation-46-finalizer.test.js'))pkg.scripts['qa:test']+=' && node independent-audit/tests/generation-46-finalizer.test.js';
          pkg.scripts['qa:finalize:phase-b-generation-46']='node scripts/qa/finalize-phase-b-generation-46.js';
          write('package.json',JSON.stringify(pkg,null,2)+'\n');

          let auto=read('scripts/qa/validate-auto-gate.js');
          const seq46Auto=seq(46);
          const legal=/const legalSequences=(\[[^\n]+\]);/u.exec(auto);
          if(!legal)throw new Error('legalSequences definition not found');
          if(!legal[1].includes(seq46Auto)){
            const extended=legal[1].slice(0,-1)+','+seq46Auto+']';
            auto=auto.replace(legal[1],extended);
          }
          auto=must(auto,'through at most Generation 45','through at most Generation 46','auto-gate generation label');
          write('scripts/qa/validate-auto-gate.js',auto);

          console.log(JSON.stringify({approvedHead,approvedTree,expectedAuthorityCount:expectedAuthoritySha256.length,finalProductionSha256},null,2));
          NODE
      - name: Confirm exact dirty finalization scope
        run: |
          git status --short
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 14
      - name: Finalize Generation 46
        run: node scripts/qa/finalize-phase-b-generation-46.js
      - name: Commit Generation 46 locally and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue154-finalize-generation-46.yml
          git add -A
          git commit -m "Finalize Generation 46 for source-table guidance"
      - name: Verify committed Generation 46
        run: |
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish verified Generation 46
        run: git push origin HEAD:codex/issue-154-explanation-ux-integration

name: Issue207 exact successor validation
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: write
concurrency:
  group: issue207-isolated-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 04b2f27c7dce31ace0f6f33fd27bf8431036c3a4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct immutable Generation118 candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 04b2f27c7dce31ace0f6f33fd27bf8431036c3a4
          git diff --exit-code
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          text=''.join(''.join(pathlib.Path(f'../driver/issue207-repair-{n}.b64').read_text().split()) for n in (1,2,3))
          corrections=[[500,501,'3','7'],[561,562,'Y',''],[1732,1732,'','BGdG2abn/hh'],[1971,1971,'','L'],[1972,1973,'K',''],[1988,1990,'YF','R'],[2816,2818,'Hz',''],[11469,11469,'','1f'],[11815,11816,'1','87v98a7fH/S6g37X6+z5nfwQSo33Or3dsRd0g2']]
          for start,end,old,new in reversed(corrections):
              assert text[start:end]==old
              text=text[:start]+new+text[end:]
          raw=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a69e8b763c1d487ad445080b1d7e9d6912a8140d1173ee50671f08e0f7f7b850'
          pathlib.Path('../repair.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero ../repair.patch
          git apply --unidiff-zero ../repair.patch
          node - <<'JS'
          const fs=require('fs'),assert=require('assert'),l=require('./scripts/qa/phase-b-lifecycle');
          const c=l.createCandidate();assert.strictEqual(c.generation,118);assert(l.verifyCandidate(c).ok);
          assert.strictEqual(c.auditHash,'69c197ef727465bead71f1eee3bba8c30b860e39ecacfdd6e17f2990a5ec1dcf');
          assert.strictEqual(c.baselineIdentity,'a4802bbf6823196a613330c0a44ab47340775306e1ce0d4d525cb050fcab7f04');
          fs.writeFileSync('reports/auto-gate/audit-locks/phase-b-generation-118.json',JSON.stringify(c,null,2)+'\n',{flag:'wx'});
          JS
          npm ci
          npm run verify > "$RUNNER_TEMP/issue207-generation118-verify.log" 2>&1
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert'),crypto=require('crypto');
          const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n');paths.push('reports/auto-gate/audit-locks/phase-b-generation-118.json');assert.strictEqual(paths.length,14);
          const blob=(path,bytes)=>({path,sha:crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex'),content:bytes.toString('base64')});
          const objects=paths.map(path=>blob(path,fs.readFileSync(path)));
          const testPackage=Buffer.from(fs.readFileSync('package.json','utf8').replace('node tests/content-progress-integration.test.js && ',''));
          const testBlob=blob('package.json',testPackage);assert.strictEqual(testBlob.sha,'4a9d063e2f3b2c05db6e7133d87472240994d47f');objects.push(testBlob);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/issue207-objects.json',JSON.stringify(objects));
          cp.execFileSync('git',['add','--',...paths]);cp.execFileSync('git',['diff','--exit-code']);
          const tree=cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim();assert.strictEqual(tree,'173d5c747353183b9a57f9effc3fb0f677c1c664');console.log('IMMUTABLE_PREDECESSOR_TREE '+tree);
          JS
          git -c user.name=issue207-validation -c user.email=validation@users.noreply.github.com commit -m 'Local-only immutable Generation118 premerge candidate; not accepted'
      - name: Apply reviewed provenance correction and append Generation119
        working-directory: candidate
        run: |
          python3 ../driver/issue207-successor119.py
          node - <<'JS'
          const fs=require('fs'),assert=require('assert'),l=require('./scripts/qa/phase-b-lifecycle');
          const c=l.createCandidate();assert.strictEqual(c.generation,119);assert(l.verifyCandidate(c).ok);
          assert.strictEqual(c.auditHash,'6e9ace978ea3e5f405cacd03a32f23c09bce5f7de80728f3243b3ec71141c554');
          assert.strictEqual(c.baselineIdentity,'5e0b982b6e8a92e2d1bf81490eb54ce5bd5384728bcee6b6f2b30e623d020b12');
          fs.writeFileSync('reports/auto-gate/audit-locks/phase-b-generation-119.json',JSON.stringify(c,null,2)+'\n',{flag:'wx'});
          for(const a of l.generationAuthorities())assert(fs.readFileSync(a.file).equals(a.bytes),a.file);
          JS
          git diff --check
      - name: Mandatory successor precommit verify
        working-directory: candidate
        run: |
          set +e
          npm run verify > "$RUNNER_TEMP/issue207-generation119-verify.log" 2>&1
          result=$?
          tail -n 25 "$RUNNER_TEMP/issue207-generation119-verify.log"
          exit "$result"
      - name: Install pinned CI browser dependencies
        working-directory: candidate
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Real browser migration and reload checks
        working-directory: candidate
        run: node .github/visual/run-content-progress-migration.js
      - name: Store exact candidate objects only - no branch update
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert'),cp=require('child_process'),crypto=require('crypto');
          const l=require('./scripts/qa/phase-b-lifecycle');
          for(const a of l.generationAuthorities())assert(fs.readFileSync(a.file).equals(a.bytes),a.file);
          assert(l.verifyCandidate(JSON.parse(fs.readFileSync('reports/auto-gate/audit-locks/phase-b-generation-119.json'))).ok);
          const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n');paths.push('reports/auto-gate/audit-locks/phase-b-generation-119.json');assert.strictEqual(paths.length,8);
          cp.execFileSync('git',['add','--',...paths]);cp.execFileSync('git',['diff','--exit-code']);cp.execFileSync('git',['diff','--cached','--check']);
          const tree=cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim();assert.strictEqual(tree,'d218a125e8df73cdb2e36a2c6d0824afc7d03229');
          const objects=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/issue207-objects.json'));
          for(const path of paths){const bytes=fs.readFileSync(path);objects.push({path,sha:crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex'),content:bytes.toString('base64')});}
          (async()=>{
            const unique=new Map(objects.map(object=>[object.sha,object]));
            for(const {sha,content} of unique.values()){
              const response=await fetch('https://api.github.com/repos/wataruyamashita-collab/boki-rpg-app/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({content,encoding:'base64'})});
              if(!response.ok)throw new Error('Blob storage failed: '+response.status);
              assert.strictEqual((await response.json()).sha,sha);
            }
            const metadata=objects.map(({path,sha})=>({path,sha}));fs.writeFileSync(process.env.RUNNER_TEMP+'/issue207-verified-objects.json',JSON.stringify({tree,objects:metadata},null,2));console.log('ISSUE207_VERIFIED_TREE '+tree);console.log('ISSUE207_VERIFIED_OBJECTS '+JSON.stringify(metadata));
          })().catch(error=>{console.error(error.stack);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue207-successor-validation
          path: |
            ${{ runner.temp }}/issue207-generation118-verify.log
            ${{ runner.temp }}/issue207-generation119-verify.log
            ${{ runner.temp }}/issue207-verified-objects.json
            candidate/artifacts/content-progress-migration
          retention-days: 14

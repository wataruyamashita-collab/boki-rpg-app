name: Issue207 accepted-main handoff publication
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck exact merged-main GREEN and preserve prior issue bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node issue207-publish-handoff.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue207-handoff-before-after
          path: ${{ runner.temp }}/issue207-handoff
          retention-days: 14

name: Exact main workspace export
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04b2f27c7dce31ace0f6f33fd27bf8431036c3a4
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact accepted history without credentials
        run: |
          test "$(git rev-parse HEAD)" = 04b2f27c7dce31ace0f6f33fd27bf8431036c3a4
          test "$(git rev-parse HEAD^{tree})" = b46058c4da74be67473d466bad892dbc324b066b
          git diff --exit-code
          git bundle create "$RUNNER_TEMP/issue207-main.bundle" HEAD
          sha256sum "$RUNNER_TEMP/issue207-main.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: issue207-exact-main-history
          path: ${{ runner.temp }}/issue207-main.bundle
          retention-days: 7

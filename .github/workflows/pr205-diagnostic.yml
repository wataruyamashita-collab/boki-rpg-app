name: PR205 repair validation
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 0619ec7b591ab09a39cacf86c1ae923f74a56d5c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed repairs to the exact source and generate successor
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "0619ec7b591ab09a39cacf86c1ae923f74a56d5c"
          git diff --exit-code
          for patch in pr205-repair.patch pr205-preserve-regressions.patch pr205-integrity-lookup.patch; do
            git apply --check --unidiff-zero "../driver/$patch"
            git apply --unidiff-zero "../driver/$patch"
          done
          node - <<'JS'
          const fs=require('fs'),assert=require('assert'),l=require('./scripts/qa/phase-b-lifecycle');
          const c=l.createCandidate();assert.strictEqual(c.generation,117);assert(l.verifyCandidate(c).ok);
          const previous=JSON.parse(fs.readFileSync('reports/auto-gate/audit-locks/phase-b-generation-116.json'));
          assert.deepStrictEqual(c.productionHashes,previous.productionHashes);
          assert.deepStrictEqual(Object.keys(c.files).filter(p=>c.files[p]!==previous.files[p]),['independent-audit/tests/foundation.test.js','independent-audit/tests/generation-immutability.test.js','scripts/qa/audit-core.js']);
          assert.strictEqual(c.auditHash,'4a67a66a010117c7518f47b3aa2e6a3488aa86ba64311f0192052e543a78d809');
          fs.writeFileSync('reports/auto-gate/audit-locks/phase-b-generation-117.json',JSON.stringify(c,null,2)+'\n',{flag:'wx'});
          console.log('GENERATION_117_CANDIDATE '+c.auditHash);
          JS
          git diff --check
          npm ci
      - name: Mandatory precommit verify
        working-directory: candidate
        run: |
          set +e
          npm run verify > "$RUNNER_TEMP/pr205-verify.log" 2>&1
          result=$?
          tail -n 40 "$RUNNER_TEMP/pr205-verify.log"
          exit "$result"
      - name: Pending successor immutability regression
        working-directory: candidate
        run: |
          set +e
          node independent-audit/tests/generation-immutability.test.js > "$RUNNER_TEMP/pr205-immutability.log" 2>&1
          result=$?
          tail -n 12 "$RUNNER_TEMP/pr205-immutability.log"
          exit "$result"
      - name: Store exact verified file objects only - never update a branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert'),cp=require('child_process');
          const expected={
            'independent-audit/tests/generation-immutability.test.js':'c9af4dfa5abc2d8b6be90de7d7e2412b8989cc162153e1cb4a999194125073ee',
            'scripts/audit-explanations.js':'5b77a5e9c10a899168c8077c6c299ba93f450aff647340563b015a87d6587aea',
            'tests/explanation-audit-regression.test.js':'ea5b14c604bd101dd0c124ade0eba90c3528d8c1f5c36a4fb93202ac1fd8142c',
            'reports/auto-gate/audit-locks/phase-b-generation-117.json':'c0b3772d11e546a95c08af77faab8597f93d04a524784a2d19583bea5d617842',
            'tests/true-oracle.test.js':'2489d76113893db36803a1e0de24a883ac4721dbdb63a66889b80e7059fdc84f',
            '.github/visual/run-journal-explanation-ticket.js':'6db5eb77ac1315501370d59b847dfee20ec8685554d8f9ac6658c13657b0e3b6',
            'scripts/qa/audit-core.js':'3dae1b13749b74f8ca50f8191ec0794a53a7e775e2d4c43723dac03896e0fccd',
            'independent-audit/tests/foundation.test.js':'b7e3014d6b04b3cb8afc6bc2d39fde4179e0313b5ae5113b7847cf8983116f4d'
          };
          const l=require('./scripts/qa/phase-b-lifecycle');
          for(const a of l.generationAuthorities())assert(fs.readFileSync(a.file).equals(a.bytes),a.file);
          assert(l.verifyCandidate(JSON.parse(fs.readFileSync('reports/auto-gate/audit-locks/phase-b-generation-117.json'))).ok);
          cp.execFileSync('git',['add','--',...Object.keys(expected)]);
          cp.execFileSync('git',['diff','--exit-code']);
          cp.execFileSync('git',['diff','--cached','--check']);
          const tree=cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim();assert.strictEqual(tree,'b46058c4da74be67473d466bad892dbc324b066b');
          (async()=>{
            const blobs=[];
            for(const [path,hash] of Object.entries(expected)){
              const bytes=fs.readFileSync(path);assert.strictEqual(crypto.createHash('sha256').update(bytes).digest('hex'),hash,path);
              const gitSha=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              const response=await fetch('https://api.github.com/repos/wataruyamashita-collab/boki-rpg-app/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});
              if(!response.ok)throw new Error('Blob storage failed: '+response.status);
              const result=await response.json();assert.strictEqual(result.sha,gitSha,path);blobs.push({path,sha:result.sha,sha256:hash});
            }
            console.log('PR205_VALIDATED_TREE '+tree);console.log('PR205_VALIDATED_BLOBS '+JSON.stringify(blobs));
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr205-repair-verification-logs
          path: |
            ${{ runner.temp }}/pr205-verify.log
            ${{ runner.temp }}/pr205-immutability.log
          retention-days: 7

name: Issue207 repair transport verification
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: read
jobs:
  verify-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: issue207-repair-carrier
          path: issue207-repair-*.b64
          retention-days: 7
      - name: Check transport without applying any code
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          text=''.join(''.join(pathlib.Path(f'issue207-repair-{n}.b64').read_text().split()) for n in (1,2,3))
          raw=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a69e8b763c1d487ad445080b1d7e9d6912a8140d1173ee50671f08e0f7f7b850'
          print('TRANSPORT_SHA256_VERIFIED')
          PY

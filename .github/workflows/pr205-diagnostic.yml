name: Issue207 exact merged-main history export
on:
  push:
    branches: [qa/pr205-exact-head-diagnostic-20261007]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69e9ba9ce5b309e7331874a03567bc979f50ba57
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual merged history and export without credentials
        run: |
          test "$(git rev-parse HEAD)" = 69e9ba9ce5b309e7331874a03567bc979f50ba57
          test "$(git rev-parse HEAD^{tree})" = d218a125e8df73cdb2e36a2c6d0824afc7d03229
          test "$(git show -s --format=%P HEAD)" = "04b2f27c7dce31ace0f6f33fd27bf8431036c3a4 6e337300937dcc60a54be4bf31aab56b3208f6d0"
          git diff --exit-code
          git bundle create "$RUNNER_TEMP/issue207-merged-main.bundle" HEAD
          sha256sum "$RUNNER_TEMP/issue207-merged-main.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: issue207-exact-merged-main-history
          path: ${{ runner.temp }}/issue207-merged-main.bundle
          retention-days: 7

name: Issue 154 finalize Generation 47
on:
  push:
    branches:
      - codex/issue-154-explanation-ux-integration

permissions:
  contents: write

jobs:
  finalize-generation-47:
    if: github.event.head_commit.message == 'Prepare remote Generation 47 finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/issue-154-explanation-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify current Generation 46 baseline
        run: npm run verify
      - name: Apply beginner-facing explanation wording
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s);
          const replaceOnce=(file,from,to,label)=>{
            const source=read(file);
            if(source.split(from).length!==2)throw new Error('unexpected anchor count: '+label);
            write(file,source.replace(from,to));
          };

          replaceOnce('js/explanation-model.js',
            "  const labels={date:'日付',description:'摘要',account:'勘定科目',item:'項目',quantity:'数量',unitPrice:'単価',amount:'金額',debit:'借方',credit:'貸方',balance:'残高',asset:'固定資産',acquisitionDate:'取得日',acquisitionCost:'取得原価',life:'耐用年数',months:'使用月数',openingAccumulated:'期首減価償却累計額',currentDepreciation:'当期減価償却費',closingAccumulated:'期末減価償却累計額',closingBookValue:'期末帳簿価額'};",
            "  const labels={date:'日付',description:'摘要',transaction:'取引内容',account:'勘定科目',item:'項目',quantity:'数量',unitPrice:'単価',amount:'金額',debit:'借方',credit:'貸方',balance:'残高',asset:'固定資産',acquisitionDate:'取得日',acquisitionCost:'取得原価',life:'耐用年数',months:'使用月数',openingAccumulated:'期首減価償却累計額',currentDepreciation:'当期減価償却費',closingAccumulated:'期末減価償却累計額',closingBookValue:'期末帳簿価額'};",
            'learner labels');
          replaceOnce('js/explanation-model.js',
            "  function sourceValues(m){if(!obj(m))return[{label:'内容',value:String(m??'')}];return Object.entries(m).filter(([k,v])=>!['資料','title','name','type','document'].includes(k)&&shown(v)).map(([k,v])=>({label:String(k),value:num(v)}));}",
            "  function sourceValues(m){if(!obj(m))return[{label:'内容',value:String(m??'')}];return Object.entries(m).filter(([k,v])=>!['資料','title','name','type','document'].includes(k)&&shown(v)).map(([k,v])=>({label:labels[k]||String(k),value:num(v)}));}",
            'localized source labels');
          replaceOnce('js/explanation-model.js',
            "  const tableFocus=q=>(q.format==='bookkeeping-inventory-ledger'||/商品有高帳/u.test(String(q.category||'')))?'日付ごとに「数量 → 単価 → 金額」の順で横に確認します。':'行・列・入力欄の位置と、すでに記載されている数値を確認';",
            "  const tableFocus=q=>{const format=q.format||'',category=String(q.category||'');if(format==='bookkeeping-inventory-ledger'||/商品有高帳/u.test(category))return '日付ごとに「数量 → 単価 → 金額」の順で横に確認します。';if(format==='fixed-asset-ledger'||/固定資産台帳/u.test(category))return '取得原価・耐用年数など、計算に使う条件を横に確認します。';return '表に書かれている内容と、空欄の位置を確認します。';};\n  const materialFocus=q=>{const format=q.format||'',category=String(q.category||'');if(format==='bookkeeping-voucher-entry')return '取引内容と金額を確認する';if(format==='bookkeeping-notes-receivable'||format==='bookkeeping-notes-payable')return '日付・相手先・金額を確認する';if(format==='fixed-asset-ledger'||/固定資産台帳/u.test(category))return '取得原価・耐用年数など、計算に使う条件を確認する';return '資料に書かれている内容を確認する';};",
            'beginner source focus');
          replaceOnce('js/explanation-model.js',"focus:'資料の項目と数値を確認'","focus:materialFocus(q)",'material focus');
          replaceOnce('js/explanation-model.js',"focus:'取引条件・日付・金額・指定された処理を確認'","focus:'問題文の条件と、何を求める問題かを確認する'",'prompt focus');
          replaceOnce('js/explanation-model.js',
            "  function checks(q){if(q.type==='journal'){const d=(q.answer?.debit||[]).reduce((s,r)=>s+(Number(r.amount)||0),0),c=(q.answer?.credit||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);return[{label:'借方合計と貸方合計が一致',expected:d===c?\`\${num(d)} = \${num(c)}\`:'不一致',evidenceRefs:['answer.debit','answer.credit']}];}const locs=locations(q),out=Object.entries(q.answer?.cells||{}).map(([id,v])=>({label:\`\${cellLabel(q,id,locs.get(id))}を正答値と照合\`,expected:num(v),evidenceRefs:[\`answer.cells.\${id}\`]}));if(q.format==='bookkeeping-voucher-entry'){out.unshift({label:'現金の動きと伝票の種類が合っているか',expected:'増える → 入金伝票 / 減る → 出金伝票 / 動かない → 振替伝票',evidenceRefs:['table.rows']});return out;}if(q.type==='ledger')out.unshift({label:'上から順に残高または帳簿値を更新',expected:'各行の結果を次の行の計算へ引き継ぐ',evidenceRefs:['table.rows']});return out;}",
            "  function checks(q){if(q.type==='journal'){const d=(q.answer?.debit||[]).reduce((s,r)=>s+(Number(r.amount)||0),0),c=(q.answer?.credit||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);return[{label:'借方合計と貸方合計が合っているか確認する',expected:d===c?\`\${num(d)} = \${num(c)}\`:'不一致',evidenceRefs:['answer.debit','answer.credit']}];}const locs=locations(q),out=Object.entries(q.answer?.cells||{}).map(([id,v])=>({label:\`\${cellLabel(q,id,locs.get(id))}を確認する\`,expected:num(v),evidenceRefs:[\`answer.cells.\${id}\`]})),format=q.format||'',category=String(q.category||'');if(format==='bookkeeping-voucher-entry'){out.unshift({label:'現金の動きに合った伝票を選べているか確認する',expected:'増える → 入金伝票 / 減る → 出金伝票 / 動かない → 振替伝票',evidenceRefs:['table.rows']});return out;}if(format==='bookkeeping-inventory-ledger'||/商品有高帳/u.test(category)){out.unshift({label:'数量・単価・金額の流れを確認する',expected:'払出後の残りを次の行へつなげる',evidenceRefs:['table.rows']});return out;}if(['bookkeeping-general-ledger','bookkeeping-account-ledger','bookkeeping-cash-book','bookkeeping-checking-book'].includes(format)||/元帳/u.test(category))out.unshift({label:'残高を上から順に確認する',expected:'前の残高に増減を反映して、次の残高を求める',evidenceRefs:['table.rows']});return out;}",
            'beginner checks');

          replaceOnce('js/view.js',
            "      if (format === 'bookkeeping-voucher-entry') return profile('現金が増えるか、減るか、動かないかを見る','使う伝票を決めて記入する',[\n        '現金が増える取引は入金伝票、減る取引は出金伝票に記入します。',\n        '現金が動かない取引は振替伝票に記入します。'\n      ]);",
            "      if (format === 'bookkeeping-voucher-entry') return profile('現金が増えるか、減るか、動かないかを確認する','使う伝票を決めて記入する',[\n        '現金が増えるなら入金伝票、減るなら出金伝票に記入します。',\n        '現金が動かない取引は振替伝票に記入します。'\n      ]);",
            'voucher teaching profile');
          replaceOnce('js/view.js',
            "      return profile('処理のポイントをつかむ','答えに書き込む',['問題文の条件を整理し、必要な会計処理を一つずつ決めます。','答えを書いた後は資料の条件と整合しているかを確認します。']);",
            "      return profile('問題文の条件を整理する','答えに記入する',['問題文の条件を整理し、必要な会計処理を一つずつ決めます。','答えを書いたら、問題の条件に合っているか確認します。']);",
            'generic teaching profile');
          replaceOnce('js/view.js',"'この問題では追加情報はありません。'","'ここで確認する追加の資料はありません。'",'empty learner wording');
          replaceOnce('js/view.js',"'証憑どおりの科目・金額になるか検算します。'","'証憑どおりの科目・金額になっているか確認します。'",'correction check wording');
          replaceOnce('js/view.js',"'借方合計と貸方合計の一致で転記漏れや二重計上を検算します。'","'借方合計と貸方合計が一致するか見て、転記漏れや二重計上がないか確認します。'",'trial balance check wording');
          replaceOnce('js/view.js',"'各段階の貸借一致を確認して最終数値を記入します。'","'各段階で貸借が合っているか確認し、最後の金額を記入します。'",'comprehensive wording');
          replaceOnce('js/view.js',"'合計と資料を照合して検算します。'","'合計が合っているか、元の資料と見比べて確認します。'",'generic solution wording');

          replaceOnce('data/questions.js',"if (format === 'fixed-asset-ledger' || /固定資産台帳/u.test(category)) return '取得原価・耐用年数・償却方法・使用月数を先に確定し、年額→月割→帳簿価額の順に処理します。';","if (format === 'fixed-asset-ledger' || /固定資産台帳/u.test(category)) return '取得原価・耐用年数・償却方法・使用月数を先に確認し、年額→月割→帳簿価額の順に処理します。';",'fixed asset summary');
          replaceOnce('data/questions.js',"if (format === 'bookkeeping-notes-receivable') return '受取手形記入帳の対象になる約束手形だけを選び、受取日・振出人・満期日・金額を資料から拾います。';","if (format === 'bookkeeping-notes-receivable') return '受取手形記入帳の対象になる約束手形だけを選び、受取日・振出人・満期日・金額を資料で確認します。';",'receivable summary');
          replaceOnce('data/questions.js',"if (format === 'bookkeeping-notes-payable') return '自店が振り出した約束手形だけを選び、振出日・受取人・満期日・金額を資料から拾います。';","if (format === 'bookkeeping-notes-payable') return '自店が振り出した約束手形だけを選び、振出日・受取人・満期日・金額を資料で確認します。';",'payable summary');
          replaceOnce('data/questions.js',"if (format === 'bookkeeping-voucher-entry') return '現金が増えるか、減るか、動かないかを見て、使う伝票を判断します。';","if (format === 'bookkeeping-voucher-entry') return '現金が増えるか、減るか、動かないかを確認して、使う伝票を決めます。';",'voucher summary');
          replaceOnce('data/questions.js',"return '資料の順序と金額の動きを整理し、帳簿の各欄へ対応させます。';","return '資料を順に確認し、必要な金額を帳簿のどこに記入するか決めます。';",'generic chapter8 summary');

          replaceOnce('tests/chapter8-explanation.test.js',
            "  assert(model.mistakes.length>0,\`\${q.id}: mistakes\`);\n  const meaningful=model.calculation.some(item=>/[×÷＋+−\\-＝=]/u.test(String(item.expression||'')));",
            "  assert(model.mistakes.length>0,\`\${q.id}: mistakes\`);\n  const learnerMeta=[...model.sources.map(item=>item.focus||''),...model.checks.map(item=>item.label||'')].join(' ');\n  assert(!/正答値|項目と数値|記載されている数値|帳簿値|対応づける|条件と整合/u.test(learnerMeta),\`\${q.id}: 学習者向け解説にシステム寄り表現を残さない\`);\n  const rawSourceLabels=model.sources.flatMap(item=>(item.values||[]).map(value=>String(value.label||'')));\n  assert(!rawSourceLabels.some(label=>/^(?:date|description|transaction|account|item|quantity|unitPrice|amount)$/u.test(label)),\`\${q.id}: 資料ラベルに内部英語キーを出さない\`);\n  const meaningful=model.calculation.some(item=>/[×÷＋+−\\-＝=]/u.test(String(item.expression||'')));",
            'chapter8 learner wording gate');
          replaceOnce('tests/chapter8-explanation.test.js',
            "assert(voucherModel.summary.some(item=>item.text==='現金が増えるか、減るか、動かないかを見て、使う伝票を判断します。'),'L050は初学者が判断しやすい現金の増減で説明する');\nassert(voucherModel.checks.some(item=>item.label==='現金の動きと伝票の種類が合っているか'),'L050は自然な日本語で最後の確認を表示する');",
            "assert(voucherModel.sources.every(source=>source.focus==='取引内容と金額を確認する'),'L050は何を見る資料かを具体的に示す');\nassert(voucherModel.summary.some(item=>item.text==='現金が増えるか、減るか、動かないかを確認して、使う伝票を決めます。'),'L050は初学者がそのまま行動できる表現で説明する');\nassert(voucherModel.checks.some(item=>item.label==='現金の動きに合った伝票を選べているか確認する'),'L050は自然な日本語で最後の確認を表示する');",
            'L050 learner wording assertions');
          replaceOnce('tests/chapter8-explanation.test.js',
            "assert(!/取引ごとに現金の動きと伝票の種類を対応づける|現金の受取＝入金伝票/u.test(JSON.stringify(voucherModel)),'L050へ旧来の硬い表現を残さない');",
            "assert(!/取引ごとに現金の動きと伝票の種類を対応づける|現金の受取＝入金伝票|正答値|帳簿値|資料の項目と数値/u.test(JSON.stringify(voucherModel)),'L050へ旧来の硬い表現を残さない');",
            'L050 old wording rejection');

          replaceOnce('.github/visual/run-explanation-integration.js',
            "L050:['現金が増えるか、減るか、動かないかを見る','使う伝票を決めて記入する',false]",
            "L050:['現金が増えるか、減るか、動かないかを確認する','使う伝票を決めて記入する',false]",
            'visual L050 heading');
          replaceOnce('.github/visual/run-explanation-integration.js',
            "if(/\\b(?:item|account):/u.test(m.sourceText))violations.push('RAW_INTERNAL_SOURCE_KEY');if(caseId==='L050'&&/残高または帳簿値|次の行の計算/u.test(m.checkText))violations.push('VOUCHER_GENERIC_LEDGER_CHECK');if(caseId==='L050'&&!/現金が増えるか、減るか、動かないか/u.test(m.summaryText))violations.push('VOUCHER_SUMMARY_MISSING');if(caseId==='L050'&&!/増える → 入金伝票/u.test(m.checkText))violations.push('VOUCHER_CHECK_MISSING');if(caseId==='L050'&&/取引ごとに現金の動きと伝票の種類を対応づける|現金の受取＝入金伝票/u.test(m.checkText))violations.push('VOUCHER_OLD_WORDING');if(caseId==='L050'&&!/現金が増える取引は入金伝票/u.test(m.takeawayText))violations.push('VOUCHER_TAKEAWAY_MISSING');",
            "if(/\\b(?:item|account):/u.test(m.sourceText))violations.push('RAW_INTERNAL_SOURCE_KEY');const learnerMeta=[m.sourceText,m.summaryText,m.checkText,m.takeawayText].join(' ');if(/正答値|資料の項目と数値|記載されている数値|帳簿値|対応づける|条件と整合/u.test(learnerMeta))violations.push('SYSTEM_META_WORDING');if(caseId==='L050'&&!/取引内容と金額を確認する/u.test(m.sourceText))violations.push('VOUCHER_SOURCE_FOCUS_MISSING');if(caseId==='L050'&&!/現金が増えるか、減るか、動かないかを確認して、使う伝票を決めます/u.test(m.summaryText))violations.push('VOUCHER_SUMMARY_MISSING');if(caseId==='L050'&&!/現金の動きに合った伝票を選べているか確認する/u.test(m.checkText))violations.push('VOUCHER_CHECK_MISSING');if(caseId==='L050'&&!/増える → 入金伝票/u.test(m.checkText))violations.push('VOUCHER_MAPPING_MISSING');if(caseId==='L050'&&/現金が増えるか、減るか、動かないかを見る|現金の動きと伝票の種類が合っているか|現金の受取＝入金伝票/u.test(learnerMeta))violations.push('VOUCHER_OLD_WORDING');if(caseId==='L050'&&!/現金が増えるなら入金伝票/u.test(m.takeawayText))violations.push('VOUCHER_TAKEAWAY_MISSING');",
            'visual learner wording gate');

          replaceOnce('tests/explanation-integration.test.js',
            "const feedbackIndex=html.indexOf('js/feedback.js?v=20260924-115'),modelIndex=html.indexOf('js/explanation-model.js?v=20260924-115'),viewIndex=html.indexOf('js/view.js?v=20260924-115');",
            "const feedbackIndex=html.indexOf('js/feedback.js?v=20260924-116'),modelIndex=html.indexOf('js/explanation-model.js?v=20260924-116'),viewIndex=html.indexOf('js/view.js?v=20260924-116');",
            'integration release');

          const index=read('index.html');
          if((index.match(/20260924-115/g)||[]).length!==13)throw new Error('unexpected index release token count');
          write('index.html',index.replaceAll('20260924-115','20260924-116'));
          replaceOnce('service-worker.js',"const RELEASE = '20260924-115';","const RELEASE = '20260924-116';",'service worker release');
          const manifest=JSON.parse(read('pwa-release-manifest.json'));
          if(manifest.release!=='20260924-115'||manifest.previousRelease!=='20260924-114')throw new Error('unexpected release manifest baseline');
          const digest=buffer=>crypto.createHash('sha256').update(buffer).digest('hex');
          for(const file of ['data/questions.js','js/explanation-model.js','js/view.js'])manifest.assets[file]=digest(fs.readFileSync(file));
          manifest.previousRelease='20260924-115';
          manifest.release='20260924-116';
          write('pwa-release-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Pre-authority targeted regression
        run: |
          node tests/chapter8-explanation.test.js
          node tests/explanation-integration.test.js
          node tests/service-worker.test.js
          node scripts/audit-matrix.js
          git diff --check
      - name: Generate Generation 47 finalization support
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),childProcess=require('child_process');
          const core=require('./scripts/qa/audit-core'),lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s);
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=args=>childProcess.execFileSync('git',args,{encoding:'utf8'}).trim();
          const must=(s,a,b,label)=>{if(!s.includes(a))throw new Error('missing '+label);return s.replace(a,b);};
          const seq=max=>'['+Array.from({length:max-1},(_,i)=>i+2).join(',')+']';
          const approvedHead=git(['rev-parse','HEAD']),approvedTree=git(['rev-parse','HEAD^{tree}']);
          const authorityRel=[lifecycle.ROOT_LOCK,...Array.from({length:45},(_,i)=>`reports/auto-gate/audit-locks/phase-b-generation-${i+2}.json`)];
          const expectedAuthoritySha256=authorityRel.map(f=>digest(fs.readFileSync(f)));
          const productionFiles=['css/style.css','data/questions.js','index.html','js/explanation-model.js','js/view.js','pwa-release-manifest.json','service-worker.js'];
          const finalProductionSha256=Object.fromEntries(productionFiles.map(f=>[f,core.sha(f)]));
          const finalizer=`'use strict';
          const childProcess=require('child_process'),crypto=require('crypto'),fs=require('fs'),path=require('path'),core=require('./audit-core'),lifecycle=require('./phase-b-lifecycle');
          const output=path.join(core.ROOT,'reports/auto-gate/audit-locks/phase-b-generation-47.json');
          const authorityPaths=[lifecycle.ROOT_LOCK,...Array.from({length:45},(_,i)=>\`reports/auto-gate/audit-locks/phase-b-generation-\${i+2}.json\`)].map(f=>path.join(core.ROOT,f));
          const expectedAuthoritySha256=${JSON.stringify(expectedAuthoritySha256)};
          const approvedHead='${approvedHead}',approvedTree='${approvedTree}';
          const finalProductionSha256=${JSON.stringify(finalProductionSha256)};
          const requiredDirty=new Set(['.github/visual/run-explanation-integration.js','data/questions.js','index.html','independent-audit/tests/generation-47-finalizer.test.js','independent-audit/tests/generation-immutability.test.js','js/explanation-model.js','js/view.js','package.json','pwa-release-manifest.json','scripts/qa/finalize-phase-b-generation-47.js','scripts/qa/validate-auto-gate.js','service-worker.js','tests/chapter8-explanation.test.js','tests/explanation-integration.test.js']);
          const NEW_RELEASE='20260924-116',PREVIOUS_RELEASE='20260924-115';
          const fail=m=>{console.error(\`PHASE_B_GENERATION_47_FINALIZATION_REFUSED: \${m}\`);process.exitCode=1;return false;};
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=a=>childProcess.execFileSync('git',a,{cwd:core.ROOT,encoding:'utf8'}).trim();
          const changedFiles=()=>git(['status','--porcelain','--untracked-files=all']).split(/\\n/u).filter(Boolean).map(l=>l.slice(2).trim());
          function validateRelease(){const m=JSON.parse(fs.readFileSync(path.join(core.ROOT,'pwa-release-manifest.json'),'utf8')),w=fs.readFileSync(path.join(core.ROOT,'service-worker.js'),'utf8'),i=fs.readFileSync(path.join(core.ROOT,'index.html'),'utf8');if(m.release!==NEW_RELEASE||m.previousRelease!==PREVIOUS_RELEASE)throw Error('release manifest version mismatch');if(!w.includes(\`const RELEASE = '\${NEW_RELEASE}';\`))throw Error('service worker release mismatch');if(i.includes(\`?v=\${PREVIOUS_RELEASE}\`)||(i.match(new RegExp(\`\\\\?v=\${NEW_RELEASE}\`,'g'))||[]).length!==13)throw Error('index release tokens mismatch');for(const[f,s]of Object.entries(m.assets))if(core.sha(f)!==s)throw Error(\`release asset hash mismatch: \${f}\`);}
          function finalize(){if(fs.existsSync(output)||lifecycle.generationAuthorities().some(x=>x.document.generation===47))return fail('Generation 47 already exists');if(authorityPaths.some((f,i)=>!fs.existsSync(f)||digest(fs.readFileSync(f))!==expectedAuthoritySha256[i]))return fail('historical authority raw bytes changed');if(git(['rev-parse','HEAD'])!==approvedHead||git(['rev-parse','HEAD^{tree}'])!==approvedTree)return fail('approved Generation 46 successor baseline mismatch');const d=changedFiles();if(d.length!==requiredDirty.size||d.some(f=>!requiredDirty.has(f))||[...requiredDirty].some(f=>!d.includes(f)))return fail(\`dirty scope mismatch: \${d.join(', ')}\`);try{validateRelease();}catch(e){return fail(e.message);}for(const[f,s]of Object.entries(finalProductionSha256))if(core.sha(f)!==s)return fail(\`final Production hash mismatch: \${f}\`);const a=lifecycle.generationAuthorities();if(JSON.stringify(a.map(x=>x.document.generation))!==JSON.stringify(Array.from({length:45},(_,i)=>i+2)))return fail('authority sequence must be exactly [2..46]');let c;try{c=lifecycle.createCandidate();}catch(e){return fail(e.message);}if(c.generation!==47||JSON.stringify(c.predecessor)!==JSON.stringify(lifecycle.identity(a.at(-1).document)))return fail('candidate predecessor or generation mismatch');const v=lifecycle.verifyCandidate(c);if(!v.ok)return fail(v.errors.join(', '));fs.writeFileSync(output,JSON.stringify(c,null,2)+'\\n',{flag:'wx'});console.log(\`FINALIZED \${path.relative(core.ROOT,output)}\`);return true;}
          if(require.main===module){if(!finalize())process.exit(1);}module.exports={finalProductionSha256,NEW_RELEASE,PREVIOUS_RELEASE,approvedHead,approvedTree,authorityPaths,expectedAuthoritySha256,finalize,output,validateRelease};
          `;
          write('scripts/qa/finalize-phase-b-generation-47.js',finalizer);

          const finalizerTest=`'use strict';
          const assert=require('assert'),childProcess=require('child_process'),crypto=require('crypto'),fs=require('fs');
          const core=require('../../scripts/qa/audit-core'),lifecycle=require('../../scripts/qa/phase-b-lifecycle'),finalizer=require('../../scripts/qa/finalize-phase-b-generation-47');
          let count=0;const test=(name,fn)=>{fn();count++;console.log(\`ok \${count} - \${name}\`);};const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const authorities=lifecycle.generationAuthorities(),g46=authorities.find(x=>x.document.generation===46),g47=authorities.find(x=>x.document.generation===47);
          test('Generation 47 is discoverable',()=>assert(g47));
          test('Generation 47 predecessor is exact Generation 46',()=>assert.deepStrictEqual(g47.document.predecessor,lifecycle.identity(g46.document)));
          test('Generation 47 production identity changes for beginner wording',()=>assert.notStrictEqual(g47.document.baselineIdentity,g46.document.baselineIdentity));
          test('committed Generation 47 current integrity passes',()=>assert.strictEqual(lifecycle.verifyCurrent().ok,true));
          test('duplicate Generation 47 issuance fails',()=>assert.notStrictEqual(childProcess.spawnSync(process.execPath,['scripts/qa/finalize-phase-b-generation-47.js'],{cwd:core.ROOT,encoding:'utf8'}).status,0));
          test('historical authority raw SHA values are pinned',()=>assert.deepStrictEqual(finalizer.authorityPaths.map(f=>digest(fs.readFileSync(f))),finalizer.expectedAuthoritySha256));
          console.log(\`Generation 47 finalizer regressions: \${count}/\${count}\`);
          `;
          write('independent-audit/tests/generation-47-finalizer.test.js',finalizerTest);

          let imm=read('independent-audit/tests/generation-immutability.test.js');
          const seq45=seq(45),seq46=seq(46),seq47=seq(47);
          imm=imm.replaceAll(seq46,seq47);
          imm=imm.replaceAll(seq45,seq46);
          imm=imm.replaceAll('generation46Committed','generation47Committed');
          imm=must(imm,'committed(46)','committed(47)','committed generation');
          imm=must(imm,'stale-predecessor Generation 47 successor is rejected','stale-predecessor Generation 48 successor is rejected','stale successor label');
          imm=must(imm,'skipped.generation=47','skipped.generation=48','stale successor generation');
          imm=imm.replaceAll('Generation 46','Generation 47');
          imm=imm.replaceAll('authorityPath(46)','authorityPath(47)');
          imm=imm.replaceAll('document.generation<46','document.generation<47');
          write('independent-audit/tests/generation-immutability.test.js',imm);

          const pkg=JSON.parse(read('package.json'));
          if(!pkg.scripts['qa:test'].includes('generation-47-finalizer.test.js'))pkg.scripts['qa:test']+=' && node independent-audit/tests/generation-47-finalizer.test.js';
          pkg.scripts['qa:finalize:phase-b-generation-47']='node scripts/qa/finalize-phase-b-generation-47.js';
          write('package.json',JSON.stringify(pkg,null,2)+'\n');

          let auto=read('scripts/qa/validate-auto-gate.js');
          const seq47Auto=seq(47);
          const legal=/const legalSequences=(\[[^\n]+\]);/u.exec(auto);
          if(!legal)throw new Error('legalSequences definition not found');
          if(!legal[1].includes(seq47Auto)){
            const extended=legal[1].slice(0,-1)+','+seq47Auto+']';
            auto=auto.replace(legal[1],extended);
          }
          auto=must(auto,'through at most Generation 46','through at most Generation 47','auto-gate generation label');
          write('scripts/qa/validate-auto-gate.js',auto);

          console.log(JSON.stringify({approvedHead,approvedTree,expectedAuthorityCount:expectedAuthoritySha256.length,finalProductionSha256},null,2));
          NODE
      - name: Confirm exact dirty finalization scope
        run: |
          git status --short
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 14
      - name: Finalize Generation 47
        run: node scripts/qa/finalize-phase-b-generation-47.js
      - name: Commit Generation 47 locally and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue154-finalize-generation-47.yml
          git add -A
          git commit -m "Finalize Generation 47 for beginner wording"
      - name: Verify committed Generation 47
        run: |
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish verified Generation 47
        run: git push origin HEAD:codex/issue-154-explanation-ux-integration

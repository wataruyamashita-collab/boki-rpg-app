name: browser visual gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/visual/**'
      - '.github/workflows/visual-gate.yml'
      - 'css/**'
      - 'data/**'
      - 'js/**'
      - 'index.html'
jobs:
  physical-recovery-strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gate evaluator self-tests
        run: node .github/visual/gate-core.test.js && node .github/visual/harness-source.test.js
      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run strict physical-recovery gate in real browsers
        run: node .github/visual/run-visual.js strict
      - name: Run explanation integration gate in real browsers
        run: node .github/visual/run-explanation-integration.js
      - name: Run journal explanation ticket gate in real browsers
        run: node .github/visual/run-journal-explanation-ticket.js
      - name: Run worksheet mobile gate in real browsers
        run: node .github/visual/run-worksheet-mobile.js
      - name: Run learning analysis gate in real browsers
        run: node .github/visual/run-learning-analysis.js
      - name: Run Phase 3B recommendation UX gate in real browsers
        run: node .github/visual/run-study-recommendation.js
      - name: Run Phase 4A RPG strategy board gate in real browsers
        run: node .github/visual/run-rpg-strategy-board.js
      - name: Run Phase 4B RPG area progression gate in real browsers
        run: node .github/visual/run-rpg-area-progression.js
      - name: Run Phase 4C reward policy gate in real browsers
        run: node .github/visual/run-rpg-reward-policy.js
      - name: Run Issue 161 all-300 state-isolation gate
        run: node .github/visual/run-state-isolation.js
      - name: Run Issue 161 explanation design-system gate
        run: node .github/visual/run-explanation-design-system.js
      - name: Run Issue 161 Chapter 1-3 explanation gate
        run: node .github/visual/run-ch1-3-explanations.js
      - name: Run Issue 161 Chapter 4-6 explanation gate
        run: node .github/visual/run-ch4-6-explanations.js
      - name: Run Issue 161 Chapter 7-8 explanation gate
        run: node .github/visual/run-ch7-8-explanations.js
      - name: Run Issue 161 Chapter 9-10 / comprehensive explanation gate
        run: node .github/visual/run-ch9-10-comprehensive-explanations.js
      - name: Run Issue 161 Chapter 11-12 final explanation gate
        run: node .github/visual/run-ch11-12-final-explanations.js
      - name: Upload screenshots and DOM metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-recovery-visual-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

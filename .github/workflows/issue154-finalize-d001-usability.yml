name: Issue 154 finalize D001 guidance and calculator dock
on:
  push:
    branches:
      - codex/issue-154-explanation-ux-integration

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 54 D001 usability validation retry 3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/issue-154-explanation-ux-integration

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pre-authority D001 usability checks
        run: |
          node tests/app.test.js
          node tests/mobile-layout.test.js
          node tests/gate5-structured-explanation.test.js
          git diff --check

      - name: Advance PWA release to 20260924-123
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const release='20260924-123';
          const previous='20260924-122';
          const replaceOnce=(text,from,to,label)=>{
            const parts=text.split(from);
            if(parts.length!==2) throw new Error(label+' anchor mismatch: '+(parts.length-1));
            return parts.join(to);
          };
          let html=fs.readFileSync('index.html','utf8');
          if(!html.includes(previous)) throw new Error('index release anchor missing');
          fs.writeFileSync('index.html',html.split(previous).join(release));
          let sw=fs.readFileSync('service-worker.js','utf8');
          sw=replaceOnce(sw,`const RELEASE = '${previous}';`,`const RELEASE = '${release}';`,'service worker release');
          fs.writeFileSync('service-worker.js',sw);
          const manifest=JSON.parse(fs.readFileSync('pwa-release-manifest.json','utf8'));
          if(manifest.release!==previous) throw new Error('manifest release mismatch');
          manifest.release=release;
          manifest.previousRelease=previous;
          for(const asset of Object.keys(manifest.assets)){
            manifest.assets[asset]=crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex');
          }
          fs.writeFileSync('pwa-release-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: Create Generation 54 candidate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const file='reports/auto-gate/audit-locks/phase-b-generation-54.json';
          if(fs.existsSync(file)) throw new Error('Generation 54 authority already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==53) throw new Error('Generation 53 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==54) throw new Error('expected Generation 54');
          if(candidate.predecessor.generation!==53) throw new Error('Generation 54 predecessor mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok) throw new Error(verification.errors.join(', '));
          fs.mkdirSync(path.dirname(file),{recursive:true});
          fs.writeFileSync(file,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log('GENERATION_54_CANDIDATE_OK '+candidate.baselineIdentity+' '+candidate.auditHash);
          NODE

      - name: Mandatory Generation 54 verification
        run: |
          node tests/app.test.js
          node tests/mobile-layout.test.js
          node tests/gate5-structured-explanation.test.js
          npm run verify
          npm run qa:integrity
          git diff --check

      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: D001 guidance and calculator visual gate
        run: |
          node .github/visual/run-worksheet-mobile.js
          node .github/visual/run-explanation-integration.js

      - name: Commit verified Generation 54
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-54.json
          git diff --cached --check
          git commit -m "Finalize Generation 54 for D001 usability"

      - name: Verify committed Generation 54
        run: |
          rm -rf artifacts node_modules
          npm ci
          node tests/app.test.js
          node tests/mobile-layout.test.js
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue154-finalize-d001-usability.yml
          git commit -m "Remove D001 usability finalizer"

      - name: Final exact-tree verification and publish
        run: |
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-154-explanation-ux-integration

# Generation 86 Issue #132 Phase 4C finalizer
name: Phase 4C Generation 86 finalizer
on:
  push:
    branches:
      - codex/issue-132-phase4c-reward-policy
    paths:
      - '.github/workflows/phase4c-generation86-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 86 Issue 132 Phase 4C'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-132-phase4c-reward-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-authority Generation 86 checks
        run: |
          node tests/rpg-reward-policy.test.js
          node tests/rpg-area-progression.test.js
          node tests/rpg-strategy-board.test.js
          node tests/learning-recommendation-ux.test.js
          node tests/learning-priority.test.js
          node tests/learning-metrics.test.js
          node tests/learning-mastery.test.js
          node tests/resume-reset.test.js
          node tests/issue161-input-state-contract.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          git diff --check
      - name: Prepare Release 20260924-155 and Generation 86 candidate
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const OLD='20260924-154', NEXT='20260924-155';
          const root=process.cwd();
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,value)=>fs.writeFileSync(path.join(root,file),value);
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const replaceOne=(source,from,to,label)=>{
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(from,to);
          };

          let sw=read('service-worker.js');
          sw=replaceOne(sw,`const RELEASE = '${OLD}';`,`const RELEASE = '${NEXT}';`,'service worker release');
          write('service-worker.js',sw);

          let index=read('index.html');
          const token=`?v=${OLD}`;
          const tokenCount=index.split(token).length-1;
          if(tokenCount!==15)throw new Error(`index release token count: ${tokenCount}`);
          index=index.split(token).join(`?v=${NEXT}`);
          write('index.html',index);

          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(read(manifestPath));
          if(manifest.release!==OLD)throw new Error(`unexpected current release: ${manifest.release}`);
          manifest.previousRelease=OLD;
          manifest.release=NEXT;
          for(const file of Object.keys(manifest.assets||{})){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`release asset missing: ${file}`);
            manifest.assets[file]=sha(file);
          }
          write(manifestPath,JSON.stringify(manifest,null,2)+'\n');

          const immPath='independent-audit/tests/generation-immutability.test.js';
          let imm=read(immPath);
          const list85=Array.from({length:84},(_,i)=>i+2).join(',');
          const list86=Array.from({length:85},(_,i)=>i+2).join(',');
          imm=replaceOne(imm,`  [${list85}]\n    .filter`,`  [${list86}]\n    .filter`,'authority byte list');
          imm=replaceOne(imm,`  const generation85Committed=committed(85);\n\n  test(`,`  const generation85Committed=committed(85);\n  const generation86Committed=committed(86);\n\n  test(`,'committed declaration');
          imm=replaceOne(imm,"'authority sequence tracks committed Generations through 85'","'authority sequence tracks committed Generations through 86'",'sequence title');
          imm=replaceOne(
            imm,
            `      generation85Committed\n        ? [${list85}]\n        : generation84Committed`,
            `      generation86Committed\n        ? [${list86}]\n        : generation85Committed\n        ? [${list85}]\n        : generation84Committed`,
            'sequence head'
          );
          imm=replaceOne(imm,`  for(const generation of [${list85}]){`,`  for(const generation of [${list86}]){`,'duplicate list');
          imm=replaceOne(
            imm,
            `  const generation85Pending=\n    fs.existsSync(authorityPath(85))&&!generation85Committed;`,
            `  const generation86Pending=\n    fs.existsSync(authorityPath(86))&&!generation86Committed;\n  const generation85Pending=\n    fs.existsSync(authorityPath(85))&&!generation85Committed;`,
            'pending declaration'
          );
          const generation86Block=`  if(generation86Committed){\n    test(\n      'committed Generation 86 current integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCurrent().ok,\n        true\n      )\n    );\n  }else if(generation86Pending){\n    const generation86Candidate=\n      JSON.parse(fs.readFileSync(authorityPath(86),'utf8'));\n    test(\n      'pending Generation 86 candidate integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCandidate(generation86Candidate).ok,\n        true\n      )\n    );\n  }else if(generation85Committed){`;
          imm=replaceOne(imm,'  if(generation85Committed){',generation86Block,'generation 86 integrity branch');
          write(immPath,imm);

          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const output=path.join(root,'reports/auto-gate/audit-locks/phase-b-generation-86.json');
          if(fs.existsSync(output))throw new Error('Generation 86 already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==85)throw new Error('Generation 85 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==86||candidate.predecessor?.generation!==85)throw new Error('Generation 86 chain mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok)throw new Error(`candidate invalid: ${verification.errors.join(', ')}`);
          fs.writeFileSync(output,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log(`GENERATION_86_CANDIDATE_READY ${candidate.auditHash} ${candidate.baselineIdentity}`);
          NODE
      - name: Mandatory Generation 86 tests
        run: |
          node tests/rpg-reward-policy.test.js
          node tests/rpg-area-progression.test.js
          node tests/rpg-strategy-board.test.js
          node tests/learning-recommendation-ux.test.js
          node tests/learning-priority.test.js
          node tests/learning-metrics.test.js
          node tests/learning-mastery.test.js
          node tests/resume-reset.test.js
          node tests/issue161-inventory.test.js
          node tests/issue161-input-state-contract.test.js
          node tests/issue161-state-isolation.test.js
          node independent-audit/tests/generation-immutability.test.js
          timeout 18m npm run verify
          timeout 6m npm run qa:integrity
          node scripts/qa/verify-audit-candidate.js reports/auto-gate/audit-locks/phase-b-generation-86.json
          git diff --check
      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser Generation 86 regression gates
        run: |
          node .github/visual/run-rpg-reward-policy.js
          node .github/visual/run-rpg-area-progression.js
          node .github/visual/run-rpg-strategy-board.js
          node .github/visual/run-study-recommendation.js
          node .github/visual/run-learning-analysis.js
          node .github/visual/run-state-isolation.js
          node .github/visual/run-explanation-design-system.js
          node .github/visual/run-ch1-3-explanations.js
          node .github/visual/run-ch4-6-explanations.js
          node .github/visual/run-ch7-8-explanations.js
          node .github/visual/run-ch9-10-comprehensive-explanations.js
          node .github/visual/run-ch11-12-final-explanations.js
          node .github/visual/run-journal-mobile-input.js
          node .github/visual/run-journal-explanation-ticket.js
          node .github/visual/run-calculator-dock-all-questions.js
          node .github/visual/run-calculator-dock-all-types.js
          node .github/visual/run-explanation-integration.js
          node .github/visual/run-worksheet-mobile.js
          node .github/visual/run-visual.js strict
      - name: Commit verified Generation 86
        run: |
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected=$(printf "%s\n" \
            "independent-audit/tests/generation-immutability.test.js" \
            "index.html" \
            "pwa-release-manifest.json" \
            "reports/auto-gate/audit-locks/phase-b-generation-86.json" \
            "service-worker.js" | sort)
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "GENERATION_86_FINALIZATION_REFUSED: dirty scope mismatch"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git add independent-audit/tests/generation-immutability.test.js index.html pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-86.json service-worker.js
          git diff --cached --check
          git commit -m "Finalize Generation 86 Issue 132 Phase 4C"
      - name: Verify committed Generation 86
        run: |
          rm -rf artifacts node_modules
          npm ci
          node tests/rpg-reward-policy.test.js
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/phase4c-generation86-finalize.yml
          git commit -m "Remove Generation 86 finalizer"
      - name: Final exact-tree verification and publish
        run: |
          node tests/rpg-reward-policy.test.js
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-132-phase4c-reward-policy

# Generation 98 Issue #179 S5B finalizer
# generation-title transform verified retry
# reader-viewpoint fix retry
# strict audit-evidence refresh retry
# corrected predecessor transform retry
# narrative-length fix retry
# Candidate authority is validated before commit.
# transform-fix retry
# Full npm/qa/browser validation runs on the exact final PR HEAD after publish.
name: Issue 179 S5B Generation 98 finalizer
on:
  push:
    branches:
      - codex/issue-179-s5b-ch4-6-work-cases-main97
    paths:
      - '.github/workflows/issue179-s5b-generation98-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 98 Issue 179 S5B'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-179-s5b-ch4-6-work-cases-main97
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh S5B audit evidence
        run: |
          node <<'NODE'
          'use strict';
          const assert=require('assert');
          const fs=require('fs');
          const {evidenceStamp,loadQuestions,verifyMatrix}=require('./scripts/audit-matrix');

          const targetIds=[
            'J018','J019','J117','J118','J119',
            'J022','J023','J024','J025','J026','J121','J122','J123','J124','J125','J126',
            'J029','J031'
          ].sort();
          const targetSet=new Set(targetIds);
          const matrixPath='reports/question-audit-matrix.json';
          const matrix=JSON.parse(fs.readFileSync(matrixPath,'utf8'));
          const questions=loadQuestions();

          const before=verifyMatrix(matrix,questions);
          const stale=before.stale.map(item=>item.id).sort();
          assert.deepStrictEqual(
            stale,
            targetIds,
            'S5B evidence refresh must affect exactly the locked 18 Work Cases'
          );
          for(const item of before.stale){
            assert.deepStrictEqual(
              item.reasons,
              ['SOURCE_CHANGED'],
              item.id+': S5B evidence refresh may only resolve Story source freshness'
            );
          }

          for(const row of matrix.rows){
            if(!targetSet.has(row.id))continue;
            row.sourceHash=evidenceStamp(questions[row.id]).sourceHash;
            row.story ||= {};
            row.story.status='VERIFIED';
            row.story.finding='S5B authored Work Case Beforeを問題文の取引事実と照合し、正答勘定・金額を先出しせずchapter文脈と非矛盾であることを再検証した。';
          }

          const after=verifyMatrix(matrix,questions);
          assert.strictEqual(after.ok,true,'refreshed S5A audit evidence must match production questions');
          fs.writeFileSync(matrixPath,JSON.stringify(matrix,null,2)+'\n');
          console.log('S5B_AUDIT_EVIDENCE_REFRESHED',targetIds.length);
          NODE
          git diff --check
          expected="reports/question-audit-matrix.json"
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "S5B_EVIDENCE_REFRESH_REFUSED: dirty scope mismatch"
            echo "Expected: $expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question-audit-matrix.json
          git commit -m "Refresh S5A work-case audit evidence"
      - name: Pre-authority S5B checks
        run: |
          node tests/story-work-case-narrative-s5b.test.js
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/audit-data.js
          node scripts/audit-editorial.js
          git diff --check
      - name: Prepare Release 20260924-167 and Generation 98 candidate
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const OLD='20260924-166', NEXT='20260924-167';
          const root=process.cwd();
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,value)=>fs.writeFileSync(path.join(root,file),value);
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const replaceOne=(source,from,to,label)=>{
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(from,to);
          };

          let sw=read('service-worker.js');
          sw=replaceOne(sw,`const RELEASE = '${OLD}';`,`const RELEASE = '${NEXT}';`,'service worker release');
          write('service-worker.js',sw);

          let index=read('index.html');
          const token=`?v=${OLD}`;
          const tokenCount=index.split(token).length-1;
          if(tokenCount!==15)throw new Error(`index release token count: ${tokenCount}`);
          index=index.split(token).join(`?v=${NEXT}`);
          write('index.html',index);

          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(read(manifestPath));
          if(manifest.release!==OLD)throw new Error(`unexpected current release: ${manifest.release}`);
          manifest.previousRelease=OLD;
          manifest.release=NEXT;
          for(const file of Object.keys(manifest.assets||{})){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`release asset missing: ${file}`);
            manifest.assets[file]=sha(file);
          }
          write(manifestPath,JSON.stringify(manifest,null,2)+'\n');

          const immPath='independent-audit/tests/generation-immutability.test.js';
          let imm=read(immPath);
          const list97=Array.from({length:96},(_,i)=>i+2).join(',');
          const list98=Array.from({length:97},(_,i)=>i+2).join(',');

          imm=replaceOne(
            imm,
            `  [${list97}]\n    .filter`,
            `  [${list98}]\n    .filter`,
            'authority byte list'
          );
          imm=replaceOne(
            imm,
            `  const generation97Committed=committed(97);\n`,
            `  const generation97Committed=committed(97);\n  const generation98Committed=committed(98);\n`,
            'generation 97 committed declaration'
          );
          imm=replaceOne(
            imm,
            "'authority sequence tracks committed Generations through 97'",
            "'authority sequence tracks committed Generations through 98'",
            'sequence title'
          );
          imm=replaceOne(
            imm,
            `      generation97Committed\n        ? [${list97}]\n        : generation96Committed`,
            `      generation98Committed\n        ? [${list98}]\n        : generation97Committed\n        ? [${list97}]\n        : generation96Committed`,
            'sequence head'
          );
          imm=replaceOne(
            imm,
            `  for(const generation of [${list97}]){`,
            `  for(const generation of [${list98}]){`,
            'duplicate generation list'
          );
          imm=replaceOne(
            imm,
            `  const generation97Pending=\n    fs.existsSync(authorityPath(97))&&!generation97Committed;`,
            `  const generation98Pending=\n    fs.existsSync(authorityPath(98))&&!generation98Committed;\n  const generation97Pending=\n    fs.existsSync(authorityPath(97))&&!generation97Committed;`,
            'generation 97 pending declaration'
          );
          const generation98Block=`  if(generation98Committed){\n    test(\n      'committed Generation 98 current integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCurrent().ok,\n        true\n      )\n    );\n  }else if(generation98Pending){\n    const generation98Candidate=\n      JSON.parse(fs.readFileSync(authorityPath(98),'utf8'));\n    test(\n      'pending Generation 98 candidate integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCandidate(generation98Candidate).ok,\n        true\n      )\n    );\n  }else if(generation97Committed){`;
          imm=replaceOne(
            imm,
            '  if(generation97Committed){',
            generation98Block,
            'generation 97 integrity branch'
          );
          write(immPath,imm);

          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const output=path.join(root,'reports/auto-gate/audit-locks/phase-b-generation-98.json');
          if(fs.existsSync(output))throw new Error('Generation 98 already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==97)throw new Error('Generation 97 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==98||candidate.predecessor?.generation!==97)throw new Error('Generation 98 chain mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok)throw new Error(`candidate invalid: ${verification.errors.join(', ')}`);
          fs.writeFileSync(output,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log(`GENERATION_98_CANDIDATE_READY ${candidate.auditHash} ${candidate.baselineIdentity}`);
          NODE
      - name: Pending Generation 98 validation
        run: |
          node tests/story-work-case-narrative-s5b.test.js
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/qa/verify-audit-candidate.js reports/auto-gate/audit-locks/phase-b-generation-98.json
          git diff --check
      - name: Commit verified Generation 98
        run: |
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected=$(printf "%s\n" \
            "independent-audit/tests/generation-immutability.test.js" \
            "index.html" \
            "pwa-release-manifest.json" \
            "reports/auto-gate/audit-locks/phase-b-generation-98.json" \
            "service-worker.js" | sort)
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "GENERATION_98_FINALIZATION_REFUSED: dirty scope mismatch"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git add independent-audit/tests/generation-immutability.test.js index.html pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-98.json service-worker.js
          git diff --cached --check
          git commit -m "Finalize Generation 98 Issue 179 S5B"
      - name: Verify committed Generation 98 authority
        run: |
          node tests/story-work-case-narrative-s5b.test.js
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue179-s5b-generation98-finalize.yml
          git commit -m "Remove Generation 98 Issue 179 S5B finalizer"
      - name: Final exact-tree verification and publish
        run: |
          node tests/story-work-case-narrative-s5b.test.js
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-179-s5b-ch4-6-work-cases-main97

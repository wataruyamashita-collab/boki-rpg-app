name: Pages live Release213 PWA and storage diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pages-live-reachability.yml'
      - '.github/visual/run-live-release213.js'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned diagnostic-only browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify actual HTTPS release with Service Workers enabled
        run: node .github/visual/run-live-release213.js
      - name: Remove remaining diagnostic-only destination rules
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          p = pathlib.Path('artifacts/live-release213/firewall-rules.json')
          failures = []
          for r in json.loads(p.read_text()) if p.exists() else []:
              try:
                  prefix = ['sudo', '-n', r['binary'], '-w', '5']
                  present = subprocess.run([*prefix, '-C', *r['args']], timeout=10).returncode
                  assert present in (0, 1), 'firewall query failed'
                  if present == 0: subprocess.run([*prefix, '-D', *r['args']], check=True, timeout=10)
                  assert subprocess.run([*prefix, '-C', *r['args']], timeout=10).returncode == 1, 'rule remains'
              except Exception as e: failures.append(str(e))
          assert not failures, failures
          if p.exists(): p.write_text('[]')
          print('Diagnostic destination rules absent; unrelated rules untouched')
          PY
      - name: Retain synthetic snapshots and exact-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-release213-${{ github.run_id }}
          path: artifacts/live-release213/
          if-no-files-found: error
          retention-days: 30

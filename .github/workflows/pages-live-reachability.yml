name: Pages live reachability probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pages-live-reachability.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test public Pages HTTPS connectivity (read-only)
        shell: bash
        env:
          BASE_URL: https://wataruyamashita-collab.github.io/boki-rpg-app/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, hashlib
          from urllib.parse import urljoin
          base=os.environ['BASE_URL']
          paths=('', 'index.html', 'pwa-release-manifest.json', 'service-worker.js', 'form-a.html')
          for path in paths:
              url=urljoin(base,path)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'boki-rpg-pages-readonly-probe/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(4*1024*1024+1)
                      if len(body)>4*1024*1024: raise ValueError('response too large')
                      print(f'{path or "/"}: HTTP {r.status}, bytes={len(body)}, sha256={hashlib.sha256(body).hexdigest()}, final_url={r.url}')
              except urllib.error.HTTPError as e:
                  print(f'{path or "/"}: HTTP {e.code}, final_url={e.url}')
              except Exception as e:
                  print(f'{path or "/"}: CONNECTION_ERROR {type(e).__name__}: {e}')
                  raise
          PY

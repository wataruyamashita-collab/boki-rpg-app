# Generation 96 Issue #179 S5A finalizer
# corrected predecessor transform retry
# narrative-length fix retry
# Candidate authority is validated before commit.
# Full npm/qa/browser validation runs on the exact final PR HEAD after publish.
name: Issue 179 S5A Generation 96 finalizer
on:
  push:
    branches:
      - codex/issue-179-s5a-ch1-3-work-cases-main95
    paths:
      - '.github/workflows/issue179-s5a-generation96-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 96 Issue 179 S5A'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-179-s5a-ch1-3-work-cases-main95
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-authority S5A checks
        run: |
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/audit-data.js
          node scripts/audit-editorial.js
          git diff --check
      - name: Prepare Release 20260924-165 and Generation 96 candidate
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const OLD='20260924-164', NEXT='20260924-165';
          const root=process.cwd();
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,value)=>fs.writeFileSync(path.join(root,file),value);
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const replaceOne=(source,from,to,label)=>{
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(from,to);
          };

          let sw=read('service-worker.js');
          sw=replaceOne(sw,`const RELEASE = '${OLD}';`,`const RELEASE = '${NEXT}';`,'service worker release');
          write('service-worker.js',sw);

          let index=read('index.html');
          const token=`?v=${OLD}`;
          const tokenCount=index.split(token).length-1;
          if(tokenCount!==15)throw new Error(`index release token count: ${tokenCount}`);
          index=index.split(token).join(`?v=${NEXT}`);
          write('index.html',index);

          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(read(manifestPath));
          if(manifest.release!==OLD)throw new Error(`unexpected current release: ${manifest.release}`);
          manifest.previousRelease=OLD;
          manifest.release=NEXT;
          for(const file of Object.keys(manifest.assets||{})){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`release asset missing: ${file}`);
            manifest.assets[file]=sha(file);
          }
          write(manifestPath,JSON.stringify(manifest,null,2)+'\n');

          const immPath='independent-audit/tests/generation-immutability.test.js';
          let imm=read(immPath);
          const list95=Array.from({length:94},(_,i)=>i+2).join(',');
          const list96=Array.from({length:95},(_,i)=>i+2).join(',');

          imm=replaceOne(
            imm,
            `  [${list95}]\n    .filter`,
            `  [${list96}]\n    .filter`,
            'authority byte list'
          );
          imm=replaceOne(
            imm,
            `  const generation95Committed=committed(95);\n`,
            `  const generation95Committed=committed(95);\n  const generation96Committed=committed(96);\n`,
            'generation 95 committed declaration'
          );
          imm=replaceOne(
            imm,
            "'authority sequence tracks committed Generations through 94'",
            "'authority sequence tracks committed Generations through 95'",
            'sequence title'
          );
          imm=replaceOne(
            imm,
            `      generation95Committed\n        ? [${list95}]\n        : generation94Committed`,
            `      generation96Committed\n        ? [${list96}]\n        : generation95Committed\n        ? [${list95}]\n        : generation94Committed`,
            'sequence head'
          );
          imm=replaceOne(
            imm,
            `  for(const generation of [${list95}]){`,
            `  for(const generation of [${list96}]){`,
            'duplicate generation list'
          );
          imm=replaceOne(
            imm,
            `  const generation95Pending=\n    fs.existsSync(authorityPath(95))&&!generation95Committed;`,
            `  const generation96Pending=\n    fs.existsSync(authorityPath(96))&&!generation96Committed;\n  const generation95Pending=\n    fs.existsSync(authorityPath(95))&&!generation95Committed;`,
            'generation 95 pending declaration'
          );
          const generation96Block=`  if(generation96Committed){\n    test(\n      'committed Generation 96 current integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCurrent().ok,\n        true\n      )\n    );\n  }else if(generation96Pending){\n    const generation96Candidate=\n      JSON.parse(fs.readFileSync(authorityPath(96),'utf8'));\n    test(\n      'pending Generation 96 candidate integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCandidate(generation96Candidate).ok,\n        true\n      )\n    );\n  }else if(generation95Committed){`;
          imm=replaceOne(
            imm,
            '  if(generation95Committed){',
            generation96Block,
            'generation 95 integrity branch'
          );
          write(immPath,imm);

          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const output=path.join(root,'reports/auto-gate/audit-locks/phase-b-generation-96.json');
          if(fs.existsSync(output))throw new Error('Generation 96 already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==95)throw new Error('Generation 95 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==96||candidate.predecessor?.generation!==95)throw new Error('Generation 96 chain mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok)throw new Error(`candidate invalid: ${verification.errors.join(', ')}`);
          fs.writeFileSync(output,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log(`GENERATION_96_CANDIDATE_READY ${candidate.auditHash} ${candidate.baselineIdentity}`);
          NODE
      - name: Pending Generation 96 validation
        run: |
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          node scripts/qa/verify-audit-candidate.js reports/auto-gate/audit-locks/phase-b-generation-96.json
          git diff --check
      - name: Commit verified Generation 96
        run: |
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected=$(printf "%s\n" \
            "independent-audit/tests/generation-immutability.test.js" \
            "index.html" \
            "pwa-release-manifest.json" \
            "reports/auto-gate/audit-locks/phase-b-generation-96.json" \
            "service-worker.js" | sort)
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "GENERATION_96_FINALIZATION_REFUSED: dirty scope mismatch"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git add independent-audit/tests/generation-immutability.test.js index.html pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-96.json service-worker.js
          git diff --cached --check
          git commit -m "Finalize Generation 96 Issue 179 S5A"
      - name: Verify committed Generation 96 authority
        run: |
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue179-s5a-generation96-finalize.yml
          git commit -m "Remove Generation 96 Issue 179 S5A finalizer"
      - name: Final exact-tree verification and publish
        run: |
          node tests/story-work-case-narrative.test.js
          node tests/story-character-progression.test.js
          node tests/story-narrative-result.test.js
          node tests/story-anchor-context-regression.test.js
          node tests/story-anchor-scenes.test.js
          node tests/story-narrative-bible.test.js
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node independent-audit/tests/generation-immutability.test.js
          node tests/issue161-state-isolation.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node tests/audit-matrix.test.js
          npm run qa:integrity
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-179-s5a-ch1-3-work-cases-main95

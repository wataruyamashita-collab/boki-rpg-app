# Generation 89 Issue #180 Story chapter authority finalizer
# trigger: validated pre-authority boundary
# trigger: semantic chapter validator aligned
# trigger: story e2e moved behind candidate authority
name: Issue 180 Generation 89 finalizer
on:
  push:
    branches:
      - codex/issue-180-story-chapter-authority
    paths:
      - '.github/workflows/issue180-generation89-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Generation 89 Issue 180'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-180-story-chapter-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-authority Generation 89 checks
        run: |
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node tests/issue161-inventory.test.js
          node tests/issue161-input-state-contract.test.js
          node tests/issue161-state-isolation.test.js
          node tests/issue161-ch1-3-explanation.test.js
          node tests/issue161-ch4-6-explanation.test.js
          node tests/issue161-ch7-8-explanation.test.js
          node tests/issue161-ch9-10-comprehensive-explanation.test.js
          node tests/issue161-ch11-12-final-explanation.test.js
          node tests/resume-reset.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          git diff --check
      - name: Prepare Release 20260924-158 and Generation 89 candidate
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const OLD='20260924-157', NEXT='20260924-158';
          const root=process.cwd();
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,value)=>fs.writeFileSync(path.join(root,file),value);
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const replaceOne=(source,from,to,label)=>{
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(from,to);
          };

          let sw=read('service-worker.js');
          sw=replaceOne(sw,`const RELEASE = '${OLD}';`,`const RELEASE = '${NEXT}';`,'service worker release');
          write('service-worker.js',sw);

          let index=read('index.html');
          const token=`?v=${OLD}`;
          const tokenCount=index.split(token).length-1;
          if(tokenCount!==15)throw new Error(`index release token count: ${tokenCount}`);
          index=index.split(token).join(`?v=${NEXT}`);
          write('index.html',index);

          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(read(manifestPath));
          if(manifest.release!==OLD)throw new Error(`unexpected current release: ${manifest.release}`);
          manifest.previousRelease=OLD;
          manifest.release=NEXT;
          for(const file of Object.keys(manifest.assets||{})){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`release asset missing: ${file}`);
            manifest.assets[file]=sha(file);
          }
          write(manifestPath,JSON.stringify(manifest,null,2)+'\n');

          const immPath='independent-audit/tests/generation-immutability.test.js';
          let imm=read(immPath);
          const list88=Array.from({length:87},(_,i)=>i+2).join(',');
          const list89=Array.from({length:88},(_,i)=>i+2).join(',');
          imm=replaceOne(imm,`  [${list88}]\n    .filter`,`  [${list89}]\n    .filter`,'authority byte list');
          imm=replaceOne(
            imm,
            `  const generation88Committed=committed(88);\n\n  test(`,
            `  const generation88Committed=committed(88);\n  const generation89Committed=committed(89);\n\n  test(`,
            'committed declaration'
          );
          imm=replaceOne(
            imm,
            "'authority sequence tracks committed Generations through 88'",
            "'authority sequence tracks committed Generations through 89'",
            'sequence title'
          );
          imm=replaceOne(
            imm,
            `      generation88Committed\n        ? [${list88}]\n        : generation87Committed`,
            `      generation89Committed\n        ? [${list89}]\n        : generation88Committed\n        ? [${list88}]\n        : generation87Committed`,
            'sequence head'
          );
          imm=replaceOne(imm,`  for(const generation of [${list88}]){`,`  for(const generation of [${list89}]){`,'duplicate list');
          imm=replaceOne(
            imm,
            `  const generation88Pending=\n    fs.existsSync(authorityPath(88))&&!generation88Committed;`,
            `  const generation89Pending=\n    fs.existsSync(authorityPath(89))&&!generation89Committed;\n  const generation88Pending=\n    fs.existsSync(authorityPath(88))&&!generation88Committed;`,
            'pending declaration'
          );
          const generation89Block=`  if(generation89Committed){\n    test(\n      'committed Generation 89 current integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCurrent().ok,\n        true\n      )\n    );\n  }else if(generation89Pending){\n    const generation89Candidate=\n      JSON.parse(fs.readFileSync(authorityPath(89),'utf8'));\n    test(\n      'pending Generation 89 candidate integrity passes',\n      ()=>assert.strictEqual(\n        lifecycle.verifyCandidate(generation89Candidate).ok,\n        true\n      )\n    );\n  }else if(generation88Committed){`;
          imm=replaceOne(imm,'  if(generation88Committed){',generation89Block,'generation 89 integrity branch');
          write(immPath,imm);

          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const output=path.join(root,'reports/auto-gate/audit-locks/phase-b-generation-89.json');
          if(fs.existsSync(output))throw new Error('Generation 89 already exists');
          const authorities=lifecycle.generationAuthorities();
          if(authorities.at(-1)?.document?.generation!==88)throw new Error('Generation 88 is not latest authority');
          const candidate=lifecycle.createCandidate();
          if(candidate.generation!==89||candidate.predecessor?.generation!==88)throw new Error('Generation 89 chain mismatch');
          const verification=lifecycle.verifyCandidate(candidate);
          if(!verification.ok)throw new Error(`candidate invalid: ${verification.errors.join(', ')}`);
          fs.writeFileSync(output,JSON.stringify(candidate,null,2)+'\n',{flag:'wx'});
          console.log(`GENERATION_89_CANDIDATE_READY ${candidate.auditHash} ${candidate.baselineIdentity}`);
          NODE
      - name: Mandatory Generation 89 tests
        run: |
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node tests/issue161-inventory.test.js
          node tests/issue161-input-state-contract.test.js
          node tests/issue161-state-isolation.test.js
          node tests/issue161-ch1-3-explanation.test.js
          node tests/issue161-ch4-6-explanation.test.js
          node tests/issue161-ch7-8-explanation.test.js
          node tests/issue161-ch9-10-comprehensive-explanation.test.js
          node tests/issue161-ch11-12-final-explanation.test.js
          node tests/resume-reset.test.js
          node tests/app.test.js
          node tests/exam-answer-firewall.test.js
          node scripts/qa/run-story-e2e.js
          node independent-audit/tests/generation-immutability.test.js
          timeout 18m npm run verify
          timeout 6m npm run qa:integrity
          node scripts/qa/verify-audit-candidate.js reports/auto-gate/audit-locks/phase-b-generation-89.json
          git diff --check
      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser Generation 89 regression gates
        run: |
          node .github/visual/run-learning-continuity.js
          node .github/visual/run-rpg-reward-policy.js
          node .github/visual/run-rpg-area-progression.js
          node .github/visual/run-rpg-strategy-board.js
          node .github/visual/run-study-recommendation.js
          node .github/visual/run-learning-analysis.js
          node .github/visual/run-state-isolation.js
          node .github/visual/run-explanation-design-system.js
          node .github/visual/run-ch1-3-explanations.js
          node .github/visual/run-ch4-6-explanations.js
          node .github/visual/run-ch7-8-explanations.js
          node .github/visual/run-ch9-10-comprehensive-explanations.js
          node .github/visual/run-ch11-12-final-explanations.js
          node .github/visual/run-journal-mobile-input.js
          node .github/visual/run-journal-explanation-ticket.js
          node .github/visual/run-calculator-dock-all-questions.js
          node .github/visual/run-calculator-dock-all-types.js
          node .github/visual/run-explanation-integration.js
          node .github/visual/run-worksheet-mobile.js
          node .github/visual/run-visual.js strict
      - name: Commit verified Generation 89
        run: |
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected=$(printf "%s\n" \
            "independent-audit/tests/generation-immutability.test.js" \
            "index.html" \
            "pwa-release-manifest.json" \
            "reports/auto-gate/audit-locks/phase-b-generation-89.json" \
            "service-worker.js" | sort)
          actual=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^node_modules/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "GENERATION_89_FINALIZATION_REFUSED: dirty scope mismatch"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi
          git add independent-audit/tests/generation-immutability.test.js index.html pwa-release-manifest.json reports/auto-gate/audit-locks/phase-b-generation-89.json service-worker.js
          git diff --cached --check
          git commit -m "Finalize Generation 89 Issue 180"
      - name: Verify committed Generation 89
        run: |
          rm -rf artifacts node_modules
          npm ci
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node scripts/qa/run-story-e2e.js
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue180-generation89-finalize.yml
          git commit -m "Remove Generation 89 finalizer"
      - name: Final exact-tree verification and publish
        run: |
          node tests/story-chapter-authority.test.js
          node independent-audit/tests/story-authority-b.test.js
          node scripts/qa/run-story-e2e.js
          npm run qa:test
          npm run qa:integrity
          npm run verify
          git diff --check
          rm -rf artifacts node_modules
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:codex/issue-180-story-chapter-authority
name: Release216 exact Release214 migration predeploy (diagnostic only)
on:
  push:
    branches:
      - audit/release216-predeploy-20261015
jobs:
  release214-to-216:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout diagnostic branch with immutable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mandatory predeploy base verification
        run: npm run verify
      - name: Install test-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run exact-sha Release214-to-216 manual upgrade migration proof
        run: node .github/visual/run-release216-predeploy.js
      - name: Preserve proof and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release216-214-to-216-predeploy
          path: artifacts/release216-214-to-216/
          if-no-files-found: warn
          retention-days: 30

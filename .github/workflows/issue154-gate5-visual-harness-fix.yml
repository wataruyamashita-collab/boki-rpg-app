name: Issue 154 Gate 5 visual harness fix
on:
  push:
    branches:
      - codex/issue-154-explanation-ux-integration

permissions:
  contents: write

jobs:
  fix-gate5-visual-harness:
    if: github.event.head_commit.message == 'Prepare Gate 5 visual harness fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/issue-154-explanation-ux-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Verify current Generation 48 baseline
        run: |
          npm run verify
          npm run qa:integrity
          git diff --check

      - name: Fix explanation visual harness
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('fs');
          const file='.github/visual/explanation-integration.html';
          let s=fs.readFileSync(file,'utf8');
          const old="const params=new URLSearchParams(location.search),requested=params.get('case'),candidate=window.QuestionData[requested],caseId=candidate?.chapter===8?requested:'L034';\ndocument.body.dataset.caseId=caseId;\nconst question=window.QuestionData[caseId],wrong={cells:Object.fromEntries(question.table.inputCells.map(id=>[id,'']))};\nnew window.AppView(document).renderExplanation(question,{correct:false},wrong);";
          const neu="const params=new URLSearchParams(location.search),requested=params.get('case'),candidate=window.QuestionData[requested],caseId=candidate?.explanationModel?requested:'L034';\ndocument.body.dataset.caseId=caseId;\nconst question=window.QuestionData[caseId];\nconst wrong=question.type==='journal'?{debit:[],credit:[]}:{cells:Object.fromEntries((question.table?.inputCells||[]).map(id=>[id,'']))};\nnew window.AppView(document).renderExplanation(question,{correct:false},wrong);";
          if(s.split(old).length!==2)throw new Error('visual harness anchor mismatch');
          s=s.replace(old,neu);
          fs.writeFileSync(file,s);
          NODE

      - name: Verify harness change before commit
        run: |
          node tests/gate5-structured-explanation.test.js
          npm run verify
          npm run qa:integrity
          git diff --check

      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run Gate 5 explanation visual integration
        run: node .github/visual/run-explanation-integration.js

      - name: Commit verified harness fix and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue154-gate5-visual-harness-fix.yml
          if [ -f .github/issue154-ci-trigger.txt ]; then git rm .github/issue154-ci-trigger.txt; fi
          git add .github/visual/explanation-integration.html
          git commit -m "Fix Gate 5 visual integration harness"

      - name: Verify committed harness fix
        run: |
          rm -rf artifacts
          npm run verify
          npm run qa:integrity
          git diff --check
          rm -rf artifacts
          echo "FINAL_GIT_STATUS_BEGIN"
          git status --short --untracked-files=all
          echo "FINAL_GIT_STATUS_END"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish verified harness fix
        run: git push origin HEAD:codex/issue-154-explanation-ux-integration

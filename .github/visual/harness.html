<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Production visual audit harness</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body><main class="container">
  <p id="q-category"></p><section id="q-story"><h2 id="q-scene"></h2><p id="q-context"></p><p id="q-task"></p></section>
  <div id="q-text" class="question-text"></div><section id="question-materials"></section>
  <div id="journal-container" class="journal-entry-area"></div><div id="table-container" class="table-question-wrap"></div>
</main>
<script src="/data/accounting-domain.js"></script><script src="/data/questions.js"></script><script src="/js/view.js"></script><script src="/js/controller.js"></script>
<script>
(() => {
  const questions = Object.values(window.QuestionData);
  let representativeQuestion = null;
  const hasColumns = (...keys) => question => keys.every(key => question.table?.columns?.includes(key));
  const selectors = {
    'fixed-asset': hasColumns('asset','acquisitionCost','life','openingAccumulated','currentDepreciation','closingBookValue'),
    inventory: hasColumns('date','description','quantity','unitPrice','amount'),
    ledger: question => question.table && /元帳/u.test(question.category || '') && question.format !== 'eight-column-worksheet',
    journal: question => question.type === 'journal',
    worksheet: question => question.format === 'eight-column-worksheet',
    'journal-book': question => question.id === 'L034',
    'notes-register': question => question.id === 'L042',
    'general-ledger': question => question.id === 'L037',
    'inventory-ledger': question => question.id === 'L049',
    voucher: question => question.id === 'L050'
  };
  window.visualHarness = {
    cases:Object.keys(selectors),
    assertDependencies() {
      const required = {
        QuestionData:window.QuestionData,
        AccountingDomain:window.AccountingDomain,
        AppView:window.AppView,
        AppController:window.AppController,
        'AppController.accountChoices':window.AppController?.accountChoices
      };
      const missing = Object.entries(required).filter(([name, value]) => name === 'AppController.accountChoices' ? typeof value !== 'function' : !value).map(([name]) => name);
      if (missing.length) throw new Error(`HARNESS_DEPENDENCY_MISSING: ${missing.join(', ')}`);
      return Object.keys(required);
    },
    render(name) {
      const question = questions.find(selectors[name]);
      if (!question) throw new Error(`canonical representative not found: ${name}`);
      representativeQuestion = question;
      new window.AppView(document).renderQuestion(question, {}, 'training');
      document.body.dataset.case = name; document.body.dataset.questionId = question.id;
      return { id:question.id, category:question.category, columns:question.table?.columns || [] };
    },
    canonicalColumn(key) {
      const values = [];
      let editable = false;
      for (const question of questions) {
        if (!question.table?.columns?.includes(key)) continue;
        let inputIndex = 0;
        for (const row of question.table.rows || []) Object.values(row).forEach((value, index) => {
          if (value === '入力') { const cellId = question.table.inputCells[inputIndex++]; if (question.table.columns[index] === key) { editable = true; const expected = question.answer?.cells?.[cellId]; if (expected !== '' && expected != null) values.push(expected); } }
          else if (question.table.columns[index] === key) values.push(value);
        });
      }
      return { values, editable };
    },
    representativeColumnKey(key) {
      if (representativeQuestion?.table?.columns?.includes(key)) return key;
      let inputIndex = 0;
      for (const row of representativeQuestion?.table?.rows || []) {
        for (const [index, value] of Object.values(row).entries()) {
          if (value !== '入力') continue;
          const cellId = representativeQuestion.table.inputCells[inputIndex++];
          if (cellId === key) return representativeQuestion.table.columns[index];
        }
      }
      throw new Error(`representative column not found: ${key}`);
    },
    representativeControl(key) {
      const cells = representativeQuestion?.answer?.cells || {};
      if (Object.prototype.hasOwnProperty.call(cells,key)) {
        const expected = cells[key];
        const editableAnswers = expected !== '' && expected != null ? [expected] : [];
        const formatted = editableAnswers.filter(value => typeof value === 'number').map(value => value.toLocaleString('ja-JP'));
        const requiredInputCharacters = editableAnswers.length ? Math.min(9,Math.max(4,...formatted.map(value => [...value].length + 1))) : 0;
        return { visibleValues:[], editableAnswers, editable:editableAnswers.length > 0, requiredInputCharacters, answerSource:'cell' };
      }
      return { ...window.visualHarness.representativeColumn(key), answerSource:'column' };
    },
    representativeColumn(key) {
      const columnKey = window.visualHarness.representativeColumnKey(key);
      const visibleValues = [], editableAnswers = [];
      let inputIndex = 0;
      for (const row of representativeQuestion.table.rows || []) Object.values(row).forEach((value, index) => {
        const column = representativeQuestion.table.columns[index];
        if (value === '入力') {
          const cellId = representativeQuestion.table.inputCells[inputIndex++];
          if (column === columnKey) { const expected = representativeQuestion.answer?.cells?.[cellId]; if (expected !== '' && expected != null) editableAnswers.push(expected); }
        } else if (column === columnKey) visibleValues.push(value);
      });
      const formatted = [...visibleValues,...editableAnswers].filter(value => typeof value === 'number').map(value => value.toLocaleString('ja-JP'));
      const requiredInputCharacters = editableAnswers.length ? Math.min(9,Math.max(4,...formatted.map(value => [...value].length + 1))) : 0;
      return { visibleValues, editableAnswers, editable:editableAnswers.length > 0,requiredInputCharacters };
    }
  };
})();
</script></body></html>
